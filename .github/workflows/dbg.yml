name: dbg
on:
  workflow_dispatch:
    inputs:
      args:
        description: 'fetch_result.py args'
        required: false
        default: 'probe 20260615 1 12'
jobs:
  dbg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/fetch_result.py ${{ inputs.args }}
