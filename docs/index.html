<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1B2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>艇AI - 競艇予測</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0B1B2B; --surface:#122638; --surface2:#1A3349; --line:#23425C;
  --text:#E8EEF4; --dim:#8FA6BA; --accent:#2FA8FF;
  --confA:#F5B82E; --confB:#5BC0DE; --confC:#5B6B7A;
  --b1:#F2F4F6; --b2:#15181C; --b3:#E5333C; --b4:#1F6FEB; --b5:#F5C518; --b6:#19A974;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:15px;line-height:1.5}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
#app{max-width:480px;margin:0 auto;min-height:100vh;
  padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:rgba(11,27,43,.92);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
header h1{font-size:18px;font-weight:800;letter-spacing:.04em}
header h1 span{color:var(--accent)}
#hdrDate{color:var(--dim);font-size:12px;margin-top:2px}
#hdrMeta{color:var(--dim);font-size:11px;margin-top:2px}

nav{position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:rgba(11,27,43,.95);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:none;color:var(--dim);
  padding:10px 0 8px;font-size:11px;font-weight:600;cursor:pointer}
nav button.on{color:var(--accent)}
nav button svg{display:block;margin:0 auto 3px;width:20px;height:20px;
  stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.hdrtop{display:flex;align-items:center;gap:10px}.hdrtop h1{flex:0 0 auto;margin:0}#hdrChips{flex:1 1 auto;min-width:0;display:flex;justify-content:flex-end;position:relative}#hdrChips:empty{display:none}#venSel{display:inline-flex;align-items:center;gap:6px;max-width:100%;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 12px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}#venSel .car{color:var(--dim);font-size:11px}#venMenu{position:absolute;top:calc(100% + 6px);right:0;z-index:30;min-width:120px;max-height:50vh;overflow-y:auto;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.45);-webkit-overflow-scrolling:touch}#venMenu[hidden]{display:none}.venopt{display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);padding:9px 12px;font-size:14px;border-radius:6px;cursor:pointer;white-space:nowrap}.venopt:hover{background:var(--surface)}.venopt.on{background:var(--accent);color:#06121E;font-weight:700}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);
  color:var(--text);border-radius:999px;padding:7px 14px;font-size:13px;
  font-weight:600;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#06121E}

.racelist{padding:0 16px}
.race{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  margin-bottom:10px;overflow:hidden}
.racehead{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.rno{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;font-size:16px;font-weight:800;min-width:34px}
.rven{font-size:10px;font-weight:600;color:var(--dim);line-height:1.1;margin-top:2px;letter-spacing:.02em}
.rno.jump{cursor:pointer;border-radius:8px;padding:2px 6px;margin:-2px -6px;background:rgba(91,192,222,.08);box-shadow:inset 0 0 0 1px rgba(91,192,222,.16);transition:background .15s}
.rno.jump:active{background:rgba(91,192,222,.26)}
@keyframes flashbg{0%{background:rgba(91,192,222,.30)}100%{background:transparent}}
.race.flash{animation:flashbg 1.5s ease}
.rmeta{flex:1;min-width:0}
.rtype{font-size:12px;color:var(--dim)}
.rdl{font-size:11px;color:var(--dim)}
.honmei{display:flex;gap:3px;align-items:center}
.conf{font-size:11px;font-weight:800;border-radius:6px;padding:3px 7px;min-width:24px;text-align:center}
.confA{background:var(--confA);color:#1A1200}
.confB{background:var(--confB);color:#04222C}
.senp{font-size:12px;font-weight:800;border-radius:6px;padding:3px 8px;background:#1FB97A;color:#04150C}
.livechip{font-size:10px;font-weight:800;border-radius:5px;padding:2px 6px;background:#7C4DFF;color:#fff;margin-left:4px}
.exv{min-width:34px;text-align:right;font-size:11px;color:var(--dim)}
.oddv{font-size:11px;color:#FFC53D;margin-left:6px}
.hitchip{font-size:10px;font-weight:800;border-radius:5px;padding:2px 6px;background:#1FB97A;color:#04150C;margin-left:4px}
.misschip{font-size:10px;font-weight:800;border-radius:5px;padding:2px 6px;background:#E5484D;color:#fff;margin-left:4px}
.resv{font-size:12px;font-weight:600;color:#7dd3fc;background:rgba(56,189,248,.12);padding:1px 7px;border-radius:5px}
.vlabel{font-size:11px;color:var(--mut,#8FA3B8);display:block}
.confC{background:var(--confC);color:#0B1B2B}
.lane{display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:5px;font-size:13px;font-weight:800;
  font-variant-numeric:tabular-nums}
.lane.s{width:18px;height:18px;font-size:11px;border-radius:4px}
.l1{background:var(--b1);color:#10141A}
.l2{background:var(--b2);color:#F2F4F6;box-shadow:inset 0 0 0 1px #3A4654}
.l3{background:var(--b3);color:#fff}
.l4{background:var(--b4);color:#fff}
.l5{background:var(--b5);color:#231A00}
.l6{background:var(--b6);color:#04231A}
.racebody{display:none;border-top:1px solid var(--line);padding:12px 14px}
.race.open .racebody{display:block}
.resbox{background:rgba(56,189,248,.07);border:1px solid rgba(56,189,248,.35);border-radius:10px;padding:10px 12px;margin:0 0 12px}
.resttl{font-size:11px;font-weight:700;letter-spacing:.08em;color:#7dd3fc;margin-bottom:6px}
.resrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.reschips{display:inline-flex;gap:3px}
.reskime{font-size:13px;color:#cbd5e1}
.respay{font-size:13px;color:#e2e8f0;margin-left:auto}
.respay b{color:#fde047;font-size:15px}
.rgrid{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.rcol{display:flex;flex-direction:column;gap:4px;align-items:center}
.rhd{font-size:9px;letter-spacing:.08em;color:var(--dim)}
.rcombo{display:inline-flex;gap:3px}
.rjudge{font-size:22px;font-weight:800;line-height:1}
.jhit{color:#34D399}
.jmiss{color:#F87171}
.rsub{margin-top:9px;font-size:11px;color:#94a3b8;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rtag{background:rgba(52,211,153,.15);color:#34D399;border:1px solid rgba(52,211,153,.4);border-radius:6px;padding:1px 6px;font-size:10px}
.rwait{color:var(--dim);opacity:.55}
.hjp{display:flex;gap:9px;align-items:flex-end;flex-shrink:0}
.hjc{display:flex;flex-direction:column;align-items:center;gap:6px}
.hjl{font-size:8px;letter-spacing:.04em;color:var(--dim);line-height:1}
.hjv{display:inline-flex;gap:3px;align-items:center;min-height:18px;font-size:12px}
.hjw{min-width:60px;justify-content:center}
.lph{background:rgba(140,160,180,.08);box-shadow:inset 0 0 0 1px rgba(140,160,180,.22)}
.rj2{font-size:15px;font-weight:800;line-height:1}
.resbadges{display:flex;gap:6px;flex-wrap:wrap}
.rbadge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px}
.rb-hit{background:#16a34a;color:#fff}
.rb-miss{background:rgba(148,163,184,.18);color:#94a3b8}

.sec{font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.08em;margin:8px 0 6px}
.boatrow{display:flex;align-items:center;gap:8px;padding:4px 0}
.bname{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bcls{font-size:10px;color:var(--dim);min-width:20px}
.bar{flex:0 0 96px;height:7px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bp{min-width:42px;text-align:right;font-size:12px;font-weight:700}
.pickrow{display:flex;align-items:center;gap:8px;padding:5px 0}
.prank{min-width:18px;color:var(--dim);font-size:11px;text-align:right}
.pickrow .bar{flex:1}
.pickrow .bar i{background:#3D7FB8}
.pickrow:first-of-type .bar i{background:var(--accent)}

.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.card .v{font-size:22px;font-weight:800}
.card .k{font-size:11px;color:var(--dim);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:600;font-size:11px}
th:first-child,td:first-child{text-align:left}.acctbl th,.acctbl td{text-align:center;vertical-align:middle}
.pad{padding:0 16px}
.note{color:var(--dim);font-size:13px;padding:32px 24px;text-align:center;line-height:1.8}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv span:first-child{color:var(--dim)}
.warn{margin:10px 16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  color:var(--dim);font-size:11px;line-height:1.7}
.spin{width:28px;height:28px;border:3px solid var(--surface2);border-top-color:var(--accent);
  border-radius:50%;margin:48px auto;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hdrtop"><h1>艇<span>AI</span> 競艇予測</h1><div id="hdrChips"></div></div>
    <div id="hdrDate" class="num"></div>
    <div id="hdrMeta" class="num"></div>
  </header>
  <main id="main"><div class="spin"></div></main>
</div>
<nav>
  <button id="tabSen">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg>
    厳選</button>
  <button id="tabToday" class="on">
    <svg viewBox="0 0 24 24"><path d="M3 14c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/><path d="M3 19c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/><path d="M6 11l5-7 7 5-2 3"/></svg>
    本日の予測</button>
  <button id="tabAcc">
    <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>
    的中実績</button>
  <button id="tabModel">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
    モデル</button>
</nav>
<script>
const $=s=>document.querySelector(s);
const VIEW={today:null,acc:null,model:null};
let cur="today", pred=null, selVenue=null;

const laneChip=(n,s)=>`<span class="lane ${s?'s':''} l${n}">${n}</span>`;
const comboChips=(c,s)=>c.split("-").map(n=>laneChip(n,s)).join("");
const pct=p=>(p*100).toFixed(1)+"%";
const confCls=p=>p>=0.9?"confA":p>=0.8?"confB":"confC";
const top5p=r=>r.picks?r.picks.slice(0,5).reduce((a,p)=>a+(p.p||0),0):0;
const cumCls=p=>p>=0.4?"confA":p>=0.35?"confB":"confC";
const t5hit=r=>!!(r.result&&r.picks&&r.picks.slice(0,5).some(p=>p.c===r.result.order));

function dayLabel(v){if(!v)return "";if(v.is_final)return " \u00b7 \u6700\u7d42\u65e5";if(v.day_n===1)return " \u00b7 \u521d\u65e5";if(v.day_n>1)return " \u00b7 "+v.day_n+"\u65e5\u76ee";return "";}
function sortVenues(p){if(p&&Array.isArray(p.venues))p.venues.sort((a,b)=>(a.code||0)-(b.code||0));return p;}
async function fetchJSON(url){
  const r=await fetch(url+"?t="+Date.now());
  if(!r.ok) throw new Error(url+" "+r.status);
  return r.json();
}

function setHeader(){
  if(!pred) return;
  const d=pred.date;
  $("#hdrDate").textContent=`${d.slice(0,4)}/${d.slice(4,6)}/${d.slice(6,8)} の予測`;
  $("#hdrMeta").textContent=`予測生成 ${pred.generated_at||"-"} / 学習 ${pred.model_trained_at||"-"}`;
}

function axisTable(r){ return ""; }
function renderSengen(){
  const m=$("#main");
  if(!pred){m.innerHTML='<div class="spin"></div>';return}
  setHeader();
  const cfg=pred.sengen_cfg||{};
  const list=[];
  (pred.venues||[]).forEach(v=>v.races.forEach(r=>{if(top5p(r)>=0.40)list.push({v,r})}));
  list.sort((a,b)=>(a.r.deadline||"99:99").localeCompare(b.r.deadline||"99:99"));
  if(!list.length){
    m.innerHTML=`<div class="note">本日の厳選レースはありません。<br>条件(3連単 上位5点の的中率40%以上)を満たすレースのみ表示します。</div>`;
    return;
  }
  const cards=list.map(({v,r})=>{
    const fav=r.fuku||{};
    const fb=r.boats.find(b=>b.lane===fav.lane)||{};
    const top=r.picks[0]||{c:"-",p:0};
    const picks=r.picks.slice(0,5).map((p,i)=>
      `<div class="pickrow"><span class="prank num">${i+1}</span>
        <span class="honmei">${comboChips(p.c,true)}</span>
        <span class="bar"><i style="width:${Math.min(100,p.p/r.picks[0].p*100)}%"></i></span>
        <span class="bp num">${pct(p.p)}</span>${(r.odds&&r.odds.t3&&r.odds.t3[p.c]!=null)?`<span class="oddv num">${r.odds.t3[p.c]}倍</span>`:""}</div>`).join("");
    return `<div class="race open">
      <div class="racehead">
        <span class="rno num jump" data-vc="${v.code}" data-rn="${r.no}">${r.no}R<span class="rven">${v.name}</span></span>
        <span class="rmeta"><span class="rtype">${r.type||""}</span><br>
          <span class="rdl num">締切 ${r.deadline||"-"}</span></span>
        <span class="hjp"><span class="hjc"><span class="hjl">的中率</span><span class="hjv"><span class="conf ${cumCls(top5p(r))}">${Math.round(top5p(r)*100)}%</span></span></span><span class="hjc"><span class="hjl">判定</span><span class="hjv">${r.result?`<span class="rj2 ${(top.c===r.result.order)?"jhit":"jmiss"}">${(top.c===r.result.order)?"〇":"✕"}</span>`:'<span class="rwait">—</span>'}</span></span><span class="hjc"><span class="hjl">結果</span><span class="hjv hjw">${r.result?comboChips(r.result.order,true):'<span class="lane s lph"></span><span class="lane s lph"></span><span class="lane s lph"></span>'}</span></span><span class="hjc"><span class="hjv" style="font-weight:700">${r.result&&r.result.pay3t!=null?'¥'+r.result.pay3t.toLocaleString():'<span class="rwait">—</span>'}</span><span class="hjl">${r.result&&r.result.ninki!=null?r.result.ninki+'番人気':''}</span></span></span>${(r.live&&!r.result)?'<span class="livechip">展示反映</span>':""}
      </div>
      <div class="racebody">
        <div class="sec">3連単 買い目 上位5点（的中率 ${Math.round(top5p(r)*100)}%）</div>${picks||'<div class="note" style="padding:6px 0;text-align:left">買い目データなし</div>'}
      </div></div>`;
  }).join("");
  m.innerHTML=`<div class="note" style="margin-bottom:10px">3連単 上位5点の的中率が高いレースだけを抽出(的中率40%以上)。<br>件数は日により変動します(0件の日もあります)。</div>
    <div class="racelist">${cards}</div>
    <div class="warn">本予測は統計的推定であり、的中や利益を保証するものではありません。</div>`;
  m.querySelectorAll(".racehead").forEach(h=>h.onclick=()=>h.parentElement.classList.toggle("open"));
  m.querySelectorAll(".rno.jump").forEach(el=>el.onclick=(e)=>{e.stopPropagation();selVenue=+el.dataset.vc;const rn=el.dataset.rn;show("today");let n=0;const iv=setInterval(()=>{const t=document.querySelector('.racelist .race[data-r="'+rn+'"]');if(t){clearInterval(iv);t.classList.add("open");const hh=(document.querySelector("header")||{getBoundingClientRect:()=>({height:90})}).getBoundingClientRect().height;const at=window.scrollY+t.getBoundingClientRect().top;window.scrollTo({top:Math.max(0,at-hh-8),behavior:"smooth"});void t.offsetWidth;t.classList.add("flash");setTimeout(()=>t.classList.remove("flash"),1500);}else if(++n>40)clearInterval(iv);},35);});
}

function renderToday(){
  const m=$("#main");
  if(!pred){m.innerHTML='<div class="spin"></div>';return}
  setHeader();
  if(!pred.venues||!pred.venues.length){
    m.innerHTML=`<div class="note">${pred.note||"本日の開催データがありません。"}</div>`;
    return;
  }
  if(selVenue===null||!pred.venues.some(v=>v.code===selVenue)) selVenue=pred.venues[0].code;
  const chips=pred.venues.map(v=>
    `<button class="venopt ${v.code===selVenue?'on':''}" data-v="${v.code}">${v.name}${dayLabel(v)}</button>`).join("");
  const venue=pred.venues.find(v=>v.code===selVenue);
  const races=venue.races.map(r=>{
    const top=r.picks[0]||{c:"-",p:0};
    const boats=r.boats.slice().sort((a,b)=>b.wp-a.wp).map(b=>
      `<div class="boatrow">${laneChip(b.lane)}
        <span class="bname">${b.name}</span><span class="bcls">${b.cls||""}</span>
        ${r.ex?`<span class="exv num">${r.ex[b.lane]??"-"}</span>`:""}
        <span class="bar"><i style="width:${Math.min(100,b.wp*140)}%"></i></span>
        <span class="bp num">${pct(b.wp)}</span></div>`).join("");
    const picks=r.picks.slice(0,5).map((p,i)=>
      `<div class="pickrow"><span class="prank num">${i+1}</span>
        <span class="honmei">${comboChips(p.c,true)}</span>
        <span class="bar"><i style="width:${Math.min(100,p.p/r.picks[0].p*100)}%"></i></span>
        <span class="bp num">${pct(p.p)}</span>${(r.odds&&r.odds.t3&&r.odds.t3[p.c]!=null)?`<span class="oddv num">${r.odds.t3[p.c]}倍</span>`:""}</div>`).join("");
    return `<div class="race" data-r="${r.no}">
      <div class="racehead">
        <span class="rno num">${r.no}R</span>
        <span class="rmeta"><span class="rtype">${r.type||""}</span><br>
          <span class="rdl num">締切 ${r.deadline||"-"}</span></span>
        <span class="hjp"><span class="hjc"><span class="hjl">的中率</span><span class="hjv"><span class="conf ${cumCls(top5p(r))}">${Math.round(top5p(r)*100)}%</span></span></span><span class="hjc"><span class="hjl">判定</span><span class="hjv">${r.result?`<span class="rj2 ${(top.c===r.result.order)?"jhit":"jmiss"}">${(top.c===r.result.order)?"〇":"✕"}</span>`:'<span class="rwait">—</span>'}</span></span><span class="hjc"><span class="hjl">結果</span><span class="hjv hjw">${r.result?comboChips(r.result.order,true):'<span class="lane s lph"></span><span class="lane s lph"></span><span class="lane s lph"></span>'}</span></span><span class="hjc"><span class="hjv" style="font-weight:700">${r.result&&r.result.pay3t!=null?'¥'+r.result.pay3t.toLocaleString():'<span class="rwait">—</span>'}</span><span class="hjl">${r.result&&r.result.ninki!=null?r.result.ninki+'番人気':''}</span></span></span>${(r.live&&!r.result)?'<span class="livechip">展示反映</span>':""}
      </div>
      <div class="racebody">
        ${r.live?`<div class="sec">直前情報反映済 ${r.live_at||""} / 風 ${r.wind??"-"}m 波 ${r.wave??"-"}cm</div>`:""}
        ${axisTable(r)}
        <div class="sec">勝率予測${r.ex?" / 展示タイム":""}</div>${boats}
        <div class="sec">3連単 推奨買い目 TOP5</div>${picks}
      </div></div>`;
  }).join("");
  document.getElementById("hdrChips").innerHTML=`<button id="venSel">${venue?venue.name+dayLabel(venue):""}<span class="car">▾</span></button><div id="venMenu" hidden>${chips}</div>`;
  m.innerHTML=`<div class="racelist">${races}</div>
    <div class="warn">本予測は過去データに基づく統計的推定であり、的中や利益を保証するものではありません。舟券の購入は自己責任で行ってください。</div>`;
  {const sel=document.getElementById("venSel"),menu=document.getElementById("venMenu");if(sel&&menu){sel.onclick=e=>{e.stopPropagation();menu.hidden=!menu.hidden;};document.querySelectorAll("#venMenu .venopt").forEach(o=>o.onclick=()=>{selVenue=+o.dataset.v;renderToday();});document.addEventListener("click",function _c(ev){if(!document.getElementById("venMenu"))return document.removeEventListener("click",_c);if(!ev.target.closest("#hdrChips")){const mm=document.getElementById("venMenu");if(mm)mm.hidden=true;}});}}
  m.querySelectorAll(".racehead").forEach(h=>h.onclick=()=>h.parentElement.classList.toggle("open"));
  /* venue selector dropdown */
}

function todayStats(){
  if(!pred||!pred.venues) return null;
  let n=0,w=0,t1=0,t6=0,sn=0,sh=0,st=0,rt=0,sp=0,tp=0;
  for(const v of pred.venues)for(const r of v.races){const x=r.result;if(!x)continue;
    n++;if(x.hit_win)w++;const p5=top5p(r);tp+=p5;
    if(r.picks&&r.picks[0]&&r.picks[0].c===x.order)t1++;
    if(t5hit(r)){t6++;rt+=(x.pay3t||0)}st+=500;
    if(p5>=0.40){sn++;sp+=p5;if(t5hit(r))sh++}}
  if(!n) return null;
  const sen=sn?Math.round(sh/sn*100)+"%("+sh+"/"+sn+")":"-";
  const row=`<tr><td class="num">本日<span style="color:var(--dim);font-size:9px">速報</span></td>
    <td class="num">${n}</td><td class="num">${Math.round(w/n*100)}%</td>
    <td class="num">${Math.round(t6/n*100)}%</td><td class="num">${sen}</td>
    <td class="num">${st?Math.round(rt/st*100):0}%</td></tr>`;
  return {row,n,win_hit:w,top1_hit:t1,top5_hit:t6,sen_n:sn,sen_hit:sh,sen_pred_sum:sp,top5_pred_sum:tp,stake5:st,return5:rt};
}
function renderAcc(acc){
  const m=$("#main");
  const td=todayStats();
  const accRow=(label,X,st)=>{
    const R=X.races||0,t1=X.top1_hit||0,t5=X.top5_hit||0,sn=X.sen_n||0,sh=X.sen_hit||0;
    const roi=X.stake5?Math.round((X.return5||0)/X.stake5*100):0;
    const cell=(num,den)=>den?`${num}<br><span style="color:var(--dim);font-size:11px">(${(num/den*100).toFixed(1)}%)</span>`:"-";
    const scell=(h,n)=>n?`${h}/${n}<br><span style="color:var(--dim);font-size:11px">(${(h/n*100).toFixed(1)}%)</span>`:"-";
    return `<tr${st?' style="'+st+'"':''}><td class="num">${label}</td><td class="num">${R}</td><td class="num">${cell(t1,R)}</td><td class="num">${cell(t5,R)}</td><td class="num">${scell(sh,sn)}</td><td class="num">${roi}%</td></tr>`;
  };
  const days=(acc&&acc.days)?acc.days:[];
  const t0=(acc&&acc.total)?acc.total:null;
  const tj=td?{races:td.n,top1_hit:td.top1_hit,top5_hit:td.top5_hit,sen_n:td.sen_n,sen_hit:td.sen_hit,stake5:td.stake5,return5:td.return5}:null;
  let tt=t0;
  if(t0&&tj)tt={races:(t0.races||0)+tj.races,top1_hit:(t0.top1_hit||0)+tj.top1_hit,top5_hit:(t0.top5_hit||0)+tj.top5_hit,sen_n:(t0.sen_n||0)+tj.sen_n,sen_hit:(t0.sen_hit||0)+tj.sen_hit,stake5:(t0.stake5||0)+tj.stake5,return5:(t0.return5||0)+tj.return5};
  else if(!t0)tt=tj;
  if(!tt||!tt.races){m.innerHTML='<div class="note">的中実績はまだありません。<br>運用開始の翌日から自動記録されます。</div>';return;}
  const dayRows=days.slice().reverse().slice(0,60).map(d=>accRow('<span style="color:var(--dim);font-size:8px;white-space:nowrap">'+d.date.slice(2,4)+'年('+['日','月','火','水','木','金','土'][new Date(+d.date.slice(0,4),+d.date.slice(4,6)-1,+d.date.slice(6,8)).getDay()]+')</span><br>'+d.date.slice(4,6)+"/"+d.date.slice(6,8),d)).join("");
  const todayRow=tj?accRow('本日<br><span style="color:var(--dim);font-size:9px">速報</span>',tj):"";
  const totalRow=days.length?accRow('累計',tt,'font-weight:700'):"";
  m.innerHTML=`<div class="pad"><table class="acctbl">
      <tr><th>日付</th><th>R数</th><th>3連単</th><th>TOP5</th><th>厳選</th><th>回収率</th></tr>${totalRow}${todayRow}${dayRows}
    </table></div>`;
}

function renderModel(rep){
  const m=$("#main");
  if(!rep){m.innerHTML='<div class="note">モデル情報がありません。<br>学習完了後に表示されます。</div>';return}
  const tm=rep.test_metrics||{}, bm=rep.baseline_metrics||{};
  const fi=Object.entries(rep.feature_importance||{}).slice(0,10)
    .map(([k,v])=>`<div class="kv"><span>${k}</span><span class="num">${Math.round(v)}</span></div>`).join("");
  m.innerHTML=`<div class="pad">
    <div class="kv"><span>学習日時</span><span class="num">${rep.trained_at||"-"}</span></div>
    <div class="kv"><span>学習期間</span><span class="num">${(rep.period||[]).join(" - ")}</span></div>
    <div class="kv"><span>学習行数</span><span class="num">${(rep.rows_train||0).toLocaleString()}</span></div>
    <div class="kv"><span>厳選条件</span><span class="num">3連単 上位5点の的中率${rep.sengen&&rep.sengen.top5_min!=null?Math.round(rep.sengen.top5_min*100):"-"}%以上</span></div>
    <div class="sec" style="margin-top:18px">テスト精度(直近期間・未学習データ)</div>
    <div class="kv"><span>1着的中率</span><span class="num">${pct(tm.win_hit_rate||0)} (基準 ${pct(bm.win_hit_rate||0)})</span></div>
    <div class="kv"><span>3連単 本線</span><span class="num">${pct(tm.top1_hit_rate||0)} (基準 ${pct(bm.top1_hit_rate||0)})</span></div>
    <div class="kv"><span>3連単 TOP6内</span><span class="num">${pct(tm.top6_hit_rate||0)} (基準 ${pct(bm.top6_hit_rate||0)})</span></div>
    <div class="kv"><span>3連単 TOP10内</span><span class="num">${pct(tm.top10_hit_rate||0)} (基準 ${pct(bm.top10_hit_rate||0)})</span></div>
    <div class="kv"><span>厳選 3連単的中率</span><span class="num">${tm.sengen&&tm.sengen.top5_hit_rate!=null?pct(tm.sengen.top5_hit_rate)+" ("+tm.sengen.races_per_day+"R/日)":"-"}</span></div>
    <div class="kv"><span>回収率(TOP6均等買い)</span><span class="num">${pct(tm.top6_roi||0)}</span></div>
    <div class="sec" style="margin-top:18px">特徴量重要度 TOP10</div>${fi}
  </div>`;
}

async function show(tab){
  cur=tab;
  {const hc=document.getElementById("hdrChips");if(hc)hc.innerHTML="";}
  const map={sen:"Sen",today:"Today",acc:"Acc",model:"Model"};
  ["Sen","Today","Acc","Model"].forEach(t=>$("#tab"+t).classList.toggle("on",map[tab]===t));
  const m=$("#main");m.innerHTML='<div class="spin"></div>';
  try{
    if(tab==="sen"){
      if(!pred) pred=await fetchJSON("predictions/latest.json");sortVenues(pred);
      renderSengen();
    }else if(tab==="today"){
      if(!pred) pred=await fetchJSON("predictions/latest.json");sortVenues(pred);
      renderToday();
    }else if(tab==="acc"){
      if(!VIEW.acc) VIEW.acc=await fetchJSON("accuracy.json").catch(()=>null);
      renderAcc(VIEW.acc);
    }else{
      if(!VIEW.model) VIEW.model=await fetchJSON("model_report.json").catch(()=>null);
      renderModel(VIEW.model);
    }
  }catch(e){
    m.innerHTML=`<div class="note">データの取得に失敗しました。<br>${e.message}</div>`;
  }
}
$("#tabSen").onclick=()=>show("sen");
$("#tabToday").onclick=()=>show("today");
$("#tabAcc").onclick=()=>show("acc");
$("#tabModel").onclick=()=>show("model");
show("sen");
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
