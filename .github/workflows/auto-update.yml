name: auto-update
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 22-23 * * *"
    - cron: "*/30 0-13 * * *"
concurrency:
  group: auto-update
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy lightgbm lhafile requests
      - name: loop results + live re-predict
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          START=$(date +%s)
          while true; do
            H=$(TZ=Asia/Tokyo date +%H)
            if [ "$H" -ge 23 ] || [ "$H" -lt 7 ]; then echo "outside active hours, exit"; exit 0; fi
            python scripts/update_all.py || true
            python scripts/predict_today.py --live || true
            git add docs/predictions
            if git diff --cached --quiet; then
              echo "nothing to commit"
            else
              git commit -m "auto update"
              pushed=0
              for attempt in 1 2 3 4 5; do
                git fetch origin main || true
                git rebase -X theirs origin/main || { echo "rebase failed, syncing to remote"; git rebase --abort || true; git reset --hard origin/main || true; break; }
                if git push origin HEAD:main; then echo "pushed (try $attempt)"; pushed=1; break; fi
                echo "push rejected (try $attempt), retrying"
                sleep 3
              done
              [ "$pushed" = 1 ] || echo "push not completed this iteration (will retry next loop)"
            fi
            E=$(( $(date +%s) - START ))
            if [ "$E" -ge 17400 ]; then echo "5h cap, exit for handoff"; exit 0; fi
            sleep 300
          done
