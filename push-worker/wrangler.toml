name = "aritei-push"
main = "worker.js"
compatibility_date = "2026-01-01"
workers_dev = true
# 版ごとのプレビュー用URL(本番とは別のアドレスで、特定の版のコードを呼べる入口)を作らない。
# 直す前の版のコードが、別のアドレスから呼べる状態で残らないようにするため。
# アプリも送信側も本番のアドレスしか使わない。
preview_urls = false

# 購読(プッシュ通知の宛先)の保管場所。id は識別子で、秘密ではない
# (wrangler kv namespace create aritei-push-subs で作成)。
kv_namespaces = [
  { binding = "SUBS", id = "baa7450161984da8b931e8a449bfec4d" }
]

# Web Push の公開鍵(docs/index.html の VAPID_PUB と同じ値。秘密ではない)。
# 送信側(GitHub Actions)は対になる秘密鍵で署名したトークンを送り、Worker はこの公開鍵で検証する。
# この Worker に秘密の値(合言葉)は置かない。
[vars]
VAPID_PUB = "BBwe0VKS6ZoMa4CDjXDpKHvp5xPR9okvoPQCQGQfZdmX8JcIBAls-FuE3qOGFd7b2dPbxI9T0XWYHsJDqvby3hQ"
