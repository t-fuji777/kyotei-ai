name: all-update
on:
  workflow_dispatch:
concurrency:
  group: all-update
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  all:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy lightgbm lhafile requests
      - name: live re-predict + results + odds
        run: |
          python scripts/update_live.py || true
          python scripts/update_all.py || true
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add docs/predictions
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "live+results+odds update"
          for attempt in 1 2 3; do
            git fetch origin main || true
            git rebase -X theirs origin/main || { echo "rebase failed"; exit 1; }
            if git push origin HEAD:main; then echo "pushed (try $attempt)"; exit 0; fi
            echo "push rejected (try $attempt), retrying"
            sleep 3
          done
          echo "push failed after retries"
          exit 1
