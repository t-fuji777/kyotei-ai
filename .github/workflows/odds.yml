name: odds-update
on:
  workflow_dispatch:
concurrency:
  group: odds
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: odds update
        run: python scripts/fetch_odds_only.py
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add docs/predictions
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "odds update"
          for attempt in 1 2 3; do
            git fetch origin main || true
            git rebase -X theirs origin/main || { echo "rebase failed"; exit 1; }
            if git push origin HEAD:main; then echo "pushed (try $attempt)"; exit 0; fi
            echo "push rejected (try $attempt), retrying"
            sleep 3
          done
          echo "push failed after retries"
          exit 1
