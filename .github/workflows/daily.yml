name: daily
on:
  schedule:
    # このリポジトリのschedule配信は恒常的に約90〜127分遅れて着弾する
    # (2026-09-02〜09-14実測: 名目6:37→実着8:07〜8:44、名目8:23→実着10:04〜10:17)。
    # 2026-09-03に「欠落」と判断して3発化したのは誤りで、実際は毎日遅れているだけだった。
    # 6:30に朝の公開を間に合わせていたのは外部のCloudflare Worker(6:30 JSTに
    # workflow_dispatch)で、これが2026-09-09を最後に停止してから毎朝8:40公開に後退した。
    # そこで名目時刻を遅延分だけ前倒しし、Workerに頼らずに6時台に着弾させる。
    # 番組表は当日早朝に公開される(9/14は05:13公開を確認)。万一それより前に着弾しても、
    # predict_todayは早朝の番組表未公開時に空ファイルを書かずに終了し、次の回が拾う。
    # 同日再実行は冪等(予測は観測フィールド保持で再生成、集計は同日置換)。
    # 2026-10-02追記: 遅延幅は一定でなく、9月上旬 約110分 → 中旬 約170分 → 下旬 約210〜250分
    # と伸びた(名目4:40の実着が 7:30頃 → 8:10〜8:53 へ後退)。遅延を1点で狙うのをやめ、
    # 1時間おきに撃って「番組表公開(毎朝5:12頃)後に最初に着弾した回」が公開する方式にする。
    # 公開前に着弾した回は predict_today が空ファイルを書かずに終了するので無害。
    # 遅延110〜250分のどこでも、公開後の最初の着弾は概ね5:30〜6:30になる。
    - cron: "40 16 * * *"   # 名目1:40 JST → 実着 3:30〜5:50
    - cron: "40 17 * * *"   # 名目2:40 JST → 実着 4:30〜6:50
    - cron: "40 18 * * *"   # 名目3:40 JST → 実着 5:30〜7:50
    - cron: "40 19 * * *"   # 名目4:40 JST → 実着 6:30〜8:50
    - cron: "10 20 * * *"   # 名目5:10 JST → 実着 7:00〜9:20
    - cron: "37 21 * * *"   # 名目6:37 JST → 予備
    - cron: "23 23 * * *"   # 名目8:23 JST → 最終防衛
  workflow_dispatch:
    inputs:
      date:
        description: "予測対象日 YYYYMMDD (省略=本日JST)"
        required: false
      gate:
        description: "動作テスト用。true にすると schedule 起動と同じく「公開済みなら省く」判定を行う"
        required: false
        default: ""
concurrency:
  group: data
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 1日7回の予約のうち、最初に成功した回のあとに着弾した回はここで終わる。
      # 遅い回(実着10〜12時)が開催中ループの打刻・結果を古い状態で上書きして消していた
      # ため(2026-08-04〜09-30で打刻110件・結果63件)。手動起動とwatchdogからの起動は
      # 省かずに最後まで実行する。判定の中身は scripts/daily_gate.py。
      - name: 当日分が公開済みなら以降を省く
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.gate }}" = "true" ]; then
            python scripts/daily_gate.py >> "$GITHUB_OUTPUT" || echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.skip != 'true'
        run: pip install lhafile pandas numpy lightgbm pillow requests
      - name: ensure icons
        if: steps.gate.outputs.skip != 'true'
        run: python scripts/make_icons.py
        continue-on-error: true
      - name: fetch latest fan data
        if: steps.gate.outputs.skip != 'true'
        run: python scripts/fetch_fan.py --latest
        continue-on-error: true
      - name: update yesterday results
        if: steps.gate.outputs.skip != 'true'
        run: python scripts/update_results.py
        continue-on-error: true
      - name: build calibration
        if: steps.gate.outputs.skip != 'true'
        continue-on-error: true
        run: python scripts/build_calib.py
      - name: retrain model (daily)
        id: train
        if: steps.gate.outputs.skip != 'true'
        run: python scripts/train.py
        continue-on-error: true
      # 学習したモデル(data/model_build。git には入れない)を Release の資産として配布する。
      # 公開URLから読み戻して sha256 が合った後にだけ、参照先(data/model/live_pointer.json)を
      # 書く。参照先と、30日ごとの予備(data/model)の更新は、次の commit ステップで main に入る。
      # ここが失敗しても朝の予測は止めない(predict today は手元の data/model_build を使い、
      # 開催中ループは前回の資産で動き続ける)。失敗は末尾のステップでジョブを赤くして知らせる。
      - name: モデルを配布 (Release資産)
        id: publish
        if: steps.gate.outputs.skip != 'true' && steps.train.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 8
        run: |
          python scripts/model_store.py publish
          python scripts/model_store.py freeze
      # 予測より前の成果物(前日結果・実績・較正・モデルの参照先)を先に確定させる。ここまでの手順は
      # 当日の予測ファイルに触れないので、開催中ループの書き込みとは衝突しない。
      # pull と push の間に開催中ループのコミットが入ると push が拒否されるので、3回まで
      # やり直す(ここで落ちると、資産だけ上がって参照先が main に届かない状態になる)。
      - name: commit (前日結果・実績・モデル)
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/races data/fan data/model docs
          git diff --cached --quiet || git commit -m "daily data $(TZ=Asia/Tokyo date +%Y%m%d)"
          for i in 1 2 3; do
            if git pull --rebase --autostash -X theirs && git push; then break; fi
            git rebase --abort 2>/dev/null || true
            if [ "$i" = 3 ]; then echo "3回試しても push できなかった"; exit 1; fi
            echo "pull/push に失敗した(try $i)。やり直す"
            sleep 3
          done
      # 当日の予測は「最新の状態を取り直す → 予測を重ねて書く → そのままpush」で公開する。
      # predict_today は手元の当日ファイルから打刻・結果・展示反映を引き継ぐので、
      # 直前に取り直せば開催中ループの書き込みを保てる。pushが競合したら(ループが先に
      # 書いた)、上書きで押し切らずに取り直してやり直す。以前は学習(約10分)の前に
      # 取り出した古い状態で作り、rebase -X theirs で押し切っていた。
      - name: predict today
        if: steps.gate.outputs.skip != 'true'
        env:
          IN_DATE: ${{ github.event.inputs.date }}
        run: |
          ARGS=""
          if [ -n "$IN_DATE" ]; then
            if ! [[ "$IN_DATE" =~ ^[0-9]{8}$ ]]; then
              echo "invalid date '$IN_DATE' (expected YYYYMMDD)"; exit 1
            fi
            ARGS="--date $IN_DATE"
          fi
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/predict_today.py $ARGS
            git add docs/predictions
            if git diff --cached --quiet; then echo "予測に変更なし"; exit 0; fi
            git commit -m "daily update $(TZ=Asia/Tokyo date +%Y%m%d)"
            if git push origin HEAD:main; then echo "pushed (try $attempt)"; exit 0; fi
            echo "pushが競合した(try $attempt)。最新を取り直して予測をやり直す"
            sleep 2
          done
          echo "6回試しても公開できなかった"; exit 1
      # 開催中ループをscheduleの遅延に任せず、ここから起動する(動いていれば何もしない)。
      # 省いた回でも実行するので、1日7回の着弾がそのままループの死活確認になる。
      - name: 開催中ループ(auto-update)が動いていなければ起動
        if: always()
        run: bash scripts/ensure_loop.sh
      # 学習や配布が失敗しても、予測の公開とループの起動までは済ませてから、ここでジョブを
      # 赤くする(GitHub標準の失敗メールが届く)。配布されていない間は daily_gate.py が
      # 省かないので、次に着弾した回が学習からやり直す。
      - name: 学習または配布の失敗を知らせる
        if: >-
          always() && steps.gate.outputs.skip != 'true'
          && (steps.train.outcome == 'failure' || steps.publish.outcome == 'failure')
        run: |
          echo "::error title=モデルの学習または配布に失敗::train=${{ steps.train.outcome }} publish=${{ steps.publish.outcome }}。予測の公開とループ起動は済んでいる。次の回が学習からやり直す"
          exit 1
