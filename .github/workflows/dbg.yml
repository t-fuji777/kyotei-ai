name: dbg
on:
  workflow_dispatch:
    inputs:
      cmd:
        description: 'command to run'
        required: false
        default: 'python scripts/predict_today.py --live'
jobs:
  dbg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lhafile pandas numpy lightgbm requests
      - run: ${{ inputs.cmd }}
