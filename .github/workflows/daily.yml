name: daily
on:
  schedule:
    # このリポジトリのschedule配信は恒常的に約90〜127分遅れて着弾する
    # (2026-09-02〜09-14実測: 名目6:37→実着8:07〜8:44、名目8:23→実着10:04〜10:17)。
    # 2026-09-03に「欠落」と判断して3発化したのは誤りで、実際は毎日遅れているだけだった。
    # 6:30に朝の公開を間に合わせていたのは外部のCloudflare Worker(6:30 JSTに
    # workflow_dispatch)で、これが2026-09-09を最後に停止してから毎朝8:40公開に後退した。
    # そこで名目時刻を遅延分だけ前倒しし、Workerに頼らずに6時台に着弾させる。
    # 番組表は当日早朝に公開される(9/14は05:13公開を確認)。万一それより前に着弾しても、
    # predict_todayは早朝の番組表未公開時に空ファイルを書かずに終了し、次の回が拾う。
    # 同日再実行は冪等(予測は観測フィールド保持で再生成、集計は同日置換)。
    # 2026-10-02追記: 遅延幅は一定でなく、9月上旬 約110分 → 中旬 約170分 → 下旬 約210〜250分
    # と伸びた(名目4:40の実着が 7:30頃 → 8:10〜8:53 へ後退)。遅延を1点で狙うのをやめ、
    # 1時間おきに撃って「番組表公開(毎朝5:12頃)後に最初に着弾した回」が公開する方式にする。
    # 公開前に着弾した回は predict_today が空ファイルを書かずに終了するので無害。
    # 遅延110〜250分のどこでも、公開後の最初の着弾は概ね5:30〜6:30になる。
    - cron: "40 16 * * *"   # 名目1:40 JST → 実着 3:30〜5:50
    - cron: "40 17 * * *"   # 名目2:40 JST → 実着 4:30〜6:50
    - cron: "40 18 * * *"   # 名目3:40 JST → 実着 5:30〜7:50
    - cron: "40 19 * * *"   # 名目4:40 JST → 実着 6:30〜8:50
    - cron: "10 20 * * *"   # 名目5:10 JST → 実着 7:00〜9:20
    - cron: "37 21 * * *"   # 名目6:37 JST → 予備
    - cron: "23 23 * * *"   # 名目8:23 JST → 最終防衛
  workflow_dispatch:
    inputs:
      date:
        description: "予測対象日 YYYYMMDD (省略=本日JST)"
        required: false
concurrency:
  group: data
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lhafile pandas numpy lightgbm pillow requests
      - name: ensure icons
        run: python scripts/make_icons.py
        continue-on-error: true
      - name: fetch latest fan data
        run: python scripts/fetch_fan.py --latest
        continue-on-error: true
      - name: update yesterday results
        run: python scripts/update_results.py
        continue-on-error: true
      - name: build calibration
        continue-on-error: true
        run: python scripts/build_calib.py
      - name: retrain model (daily)
        run: python scripts/train.py
        continue-on-error: true
      - name: predict today
        env:
          IN_DATE: ${{ github.event.inputs.date }}
        run: |
          if [ -n "$IN_DATE" ]; then
            if ! [[ "$IN_DATE" =~ ^[0-9]{8}$ ]]; then
              echo "invalid date '$IN_DATE' (expected YYYYMMDD)"; exit 1
            fi
            python scripts/predict_today.py --date "$IN_DATE"
          else
            python scripts/predict_today.py
          fi
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/races data/fan data/model docs
          git diff --cached --quiet || git commit -m "daily update $(TZ=Asia/Tokyo date +%Y%m%d)"
          git pull --rebase --autostash -X theirs
          git push
