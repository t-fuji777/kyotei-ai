name: watchdog
# 朝の予測が公開されているかをGitHubの中から独立に監視し、欠落していれば
# daily を起動して復旧させ、それでも駄目ならIssue起票とジョブ失敗で通知する。
#
# 経緯(2026-09-12の監査):
#   - これまで最終防衛線だったのはClaudeデスクトップアプリのスケジュールタスクで、
#     アプリが開いている間しか動かなかった。それをGitHub側へ移したのがこのワークフロー。
#   - 外部トリガのCloudflare Worker(kyotei-ai-trigger)は2026-09-08を最後に停止したまま。
#     朝の公開は daily の多重cronとこの監視で賄っており、Workerはもう使っていない。
#     以前はその死活(dailyの最終workflow_dispatchからの経過)も表示していたが、この監視や
#     手動の起動も同じworkflow_dispatchなので区別できず、当てにならない表示になっていたため
#     2026-10-02に削除した。
#   - 既存のdaily/auto-updateは一切変更していない。このワークフローは検知と起動だけを行い、
#     リポジトリへの書き込みは行わない(contents: read)。
on:
  workflow_dispatch:
    inputs:
      test:
        description: "動作テスト(空=通常の監視)。recover: 異常を模擬して復旧経路を通す / alert: 復旧しなかった想定で通知経路を通す(テスト用Issueを起票しジョブを失敗させる)"
        required: false
        default: ""
  schedule:
    # このリポジトリのschedule配信は約110〜250分遅延する(2026-09〜10実測。幅は日によって変わる)。
    # 名目時刻ではなく「着弾する実効時刻」で設計する。判定ゲート(7:30)より前に着弾した回は
    # 日付の判定をしないだけで無害。
    - cron: "11 19 * * *"   # 名目 JST 04:11 → 実効 6:00〜8:20(ゲート後なら最速の検知・復旧)
    - cron: "11 22 * * *"   # 名目 JST 07:11 → 実効 9:00〜11:20
    - cron: "11 1 * * *"    # 名目 JST 10:11 → 実効 12時〜14時台
    - cron: "11 5 * * *"    # 名目 JST 14:11 → 実効 16時〜18時台
permissions:
  contents: read
  issues: write
  actions: write
concurrency:
  group: watchdog
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      # Issueの割り当て先兼メンション先。リポジトリをウォッチしていない持ち主には、
      # botが作ったIssueは通知されない(2026-10-02の実地テストで通知0件を確認)。
      # 割り当てとメンションは、ウォッチの有無に関わらず通知される。
      OWNER: ${{ github.repository_owner }}
      # 手動起動時のテストモード。schedule起動では常に空で、通常の監視として動く。
      TEST_MODE: ${{ github.event.inputs.test }}
      NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
      NOTIFY_CHAT_ID: ${{ secrets.NOTIFY_CHAT_ID }}
      PUSH_SUBS_URL: ${{ vars.PUSH_SUBS_URL }}
      PUSH_AUTH_KEY: ${{ secrets.PUSH_AUTH_KEY }}
      VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # healthcheck.py は標準ライブラリのみ。pip install しないのは、依存の失敗で
      # 監視そのものが落ちる(=無音になる)経路を作らないため。
      - name: 公開JSONの健全性を判定
        id: check
        run: |
          set +e
          python scripts/healthcheck.py --source url --json > health.json
          CODE=$?
          set -e
          cat health.json
          LEVEL=$(jq -r '.level' health.json)
          if [ "$TEST_MODE" = "recover" ] || [ "$TEST_MODE" = "alert" ]; then
            echo "テストモード($TEST_MODE): 実際の判定は $LEVEL。異常(critical)を模擬して後続の経路を通す"
            echo "### テストモード: \`$TEST_MODE\` (実際の判定は \`$LEVEL\`、異常を模擬)" >> "$GITHUB_STEP_SUMMARY"
            LEVEL=critical
          fi
          echo "level=$LEVEL" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          {
            echo "### 公開JSONの判定: \`$LEVEL\`"
            echo ''
            echo "- date: \`$(jq -r '.date' health.json)\`"
            echo "- generated_at: \`$(jq -r '.generated_at' health.json)\`"
            echo "- venues: \`$(jq -r '.venues' health.json)\` / races: \`$(jq -r '.metrics.races' health.json)\`"
            jq -r '.criticals[]? | "- critical: " + .' health.json
            jq -r '.warnings[]?  | "- warning : " + .' health.json
          } >> "$GITHUB_STEP_SUMMARY"

      # 開催中ループ(auto-update)が止まっていれば起動する。止まっている間のレースは
      # 締切15分前に確定できず事後判定になるが、公開JSONの日付は正常なままなので
      # 上の判定では見つからない。時間外(5:00前・23:00以降)と稼働中は何もしない。
      - name: 開催中ループ(auto-update)の死活を確認
        id: loop
        if: github.event.inputs.test == ''
        run: |
          bash scripts/ensure_loop.sh | tee loop.txt
          echo "- $(tail -n 1 loop.txt)" >> "$GITHUB_STEP_SUMMARY"

      # 暴走防止: 既にdailyが走っている、または直近90分に2回以上完走している場合は撃たない。
      - name: 復旧のため daily を起動
        id: heal
        # alertテストでは起動しない(通知経路だけを確かめるため、不要なdaily実行を避ける)
        if: steps.check.outputs.level == 'critical' && github.event.inputs.test != 'alert'
        run: |
          CUT=$(date -u -d '90 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          RUNS=$(gh api "repos/$REPO/actions/workflows/daily.yml/runs?per_page=30" \
                   --jq "[.workflow_runs[] | select(.created_at > \"$CUT\")]")
          BUSY=$(echo "$RUNS" | jq '[.[] | select(.status != "completed")] | length')
          DONE=$(echo "$RUNS" | jq '[.[] | select(.status == "completed")] | length')
          echo "直近90分: 実行中=$BUSY 完了=$DONE"
          if [ "$BUSY" -gt 0 ]; then
            echo "dispatched=skip-busy" >> "$GITHUB_OUTPUT"
            echo "daily が実行中なので起動しない(完了を待つ)"
            exit 0
          fi
          # recoverテストでは暴走防止を外し、実際に起動できること(権限)まで確かめる
          if [ "$DONE" -ge 2 ] && [ "$TEST_MODE" != "recover" ]; then
            echo "dispatched=skip-loop" >> "$GITHUB_OUTPUT"
            echo "直近90分で2回完走済み。暴走防止のため起動しない"
            exit 0
          fi
          gh workflow run daily.yml --ref main
          echo "dispatched=true" >> "$GITHUB_OUTPUT"

      # 公開URLはGitHub Pagesのデプロイ待ちで数分遅れるため、復旧確認は origin/main の
      # 実ファイルで行う(コミットされた時点で判定できる)。
      - name: 復旧を確認
        id: recheck
        if: steps.check.outputs.level == 'critical'
        run: |
          echo "recovered=false" >> "$GITHUB_OUTPUT"
          if [ "$TEST_MODE" = "alert" ]; then
            echo "テストモード(alert): 復旧しなかった想定で通知経路へ進む"
            exit 0
          fi
          for i in $(seq 1 20); do
            sleep 60
            git fetch origin main -q || continue
            git show origin/main:docs/predictions/latest.json > /tmp/latest.json 2>/dev/null || continue
            set +e
            python scripts/healthcheck.py --source local --file /tmp/latest.json --quiet
            CODE=$?
            set -e
            if [ "$CODE" -le 1 ]; then
              echo "${i}分後に復旧を確認 (healthcheck=$CODE)"
              sed -i 's/^recovered=false$/recovered=true/' "$GITHUB_OUTPUT"
              python scripts/healthcheck.py --source local --file /tmp/latest.json
              exit 0
            fi
          done
          echo "20分待っても復旧せず"

      - name: 異常をIssueに起票
        id: issue
        if: >-
          always() &&
          (steps.check.outputs.level == 'critical' && steps.recheck.outputs.recovered != 'true')
        run: |
          YMD=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          TITLE="[アリテイ] 朝次処理の異常 $YMD"
          BODY=$(mktemp)
          {
            if [ -n "$TEST_MODE" ]; then
              TITLE="[テスト] $TITLE"
              echo "**これは動作テストです。実際の異常ではなく、対処は不要です。**"
              echo ""
            fi
            echo "@$OWNER watchdog が異常を検知しました。"
            echo ""
            echo "## 公開JSONの判定"
            echo '```'
            jq -r '"level: " + .level, "date: " + (.date|tostring), "generated_at: " + (.generated_at|tostring)' health.json
            jq -r '.criticals[]? | "critical: " + .' health.json
            jq -r '.warnings[]?  | "warning : " + .' health.json
            echo '```'
            echo ""
            echo "## 復旧の試行"
            echo "daily の起動: ${{ steps.heal.outputs.dispatched }}"
            echo "20分以内の復旧: ${{ steps.recheck.outputs.recovered }}"
            echo ""
            echo "## 対処"
            echo "1. まず Actions タブ > watchdog > Run workflow を押す(多くの場合これで直る)。"
            echo "2. 直らなければ Actions タブで daily の直近の実行ログを開き、赤いステップを見る。"
            echo ""
            echo "実行: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > "$BODY"

          gh label create pipeline-alert --color B60205 --description "朝次処理の異常" 2>/dev/null || true
          NUM=$(gh issue list --label pipeline-alert --state open --json number,title \
                  --jq "[.[] | select(.title | contains(\"$YMD\"))] | .[0].number // empty")
          if [ -n "$TEST_MODE" ]; then
            # テストは常に新規起票(当日の本物のIssueへコメントを混ぜない)
            gh issue create --title "$TITLE" --label pipeline-alert --assignee "$OWNER" --body-file "$BODY"
          elif [ -z "$NUM" ]; then
            # Issueの新規作成はリポジトリ所有者にメールで届く。これが設定ゼロで通知が出る経路。
            gh issue create --title "$TITLE" --label pipeline-alert --assignee "$OWNER" --body-file "$BODY"
          else
            gh issue comment "$NUM" --body-file "$BODY"
            echo "既存Issue #$NUM にコメントを追記"
          fi

          # Webhook / Web Push が設定されていれば即時通知も送る(未設定なら黙って何もしない)
          python scripts/notify.py --text "$(printf '朝次処理の異常を検知しました。\n判定: %s / 復旧: %s\nIssueを確認してください。' \
            "${{ steps.check.outputs.level }}" "${{ steps.recheck.outputs.recovered }}")" || true

      # ジョブを赤くするのは「本当に当日の予測が無い」ときだけにする。
      # continue-on-error を付けないことで、GitHub標準のワークフロー失敗メールが
      # 設定ゼロの通知経路として機能する。
      - name: 当日予測が無い場合はジョブを失敗させる
        if: >-
          always() && steps.check.outputs.level == 'critical'
          && steps.recheck.outputs.recovered != 'true'
        run: |
          echo "当日の予測が復旧しなかったため、このジョブを失敗として終了する"
          exit 1
