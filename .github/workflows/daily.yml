name: daily
on:
  schedule:
    # GitHubのschedule起動は保証されず、混雑時に遅延・欠落する(2026-09-03朝に
    # 21:37の回が欠落した実績)。同一ジョブを時間をずらして3発撃ち、どれかが
    # 通れば朝次処理が走る。2発目以降は同日再実行になるが冪等(予測は観測
    # フィールド保持で再生成、集計は同日置換)なので無害。
    - cron: "37 21 * * *"   # 6:37 JST 本命
    - cron: "7 22 * * *"    # 7:07 JST 予備1(欠落時の早期リカバリ)
    - cron: "23 23 * * *"   # 8:23 JST 予備2(最終防衛。2026-09-03はこれが拾った)
  workflow_dispatch:
    inputs:
      date:
        description: "予測対象日 YYYYMMDD (省略=本日JST)"
        required: false
concurrency:
  group: data
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lhafile pandas numpy lightgbm pillow requests
      - name: ensure icons
        run: python scripts/make_icons.py
        continue-on-error: true
      - name: fetch latest fan data
        run: python scripts/fetch_fan.py --latest
        continue-on-error: true
      - name: update yesterday results
        run: python scripts/update_results.py
        continue-on-error: true
      - name: build calibration
        continue-on-error: true
        run: python scripts/build_calib.py
      - name: retrain model (daily)
        run: python scripts/train.py
        continue-on-error: true
      - name: predict today
        env:
          IN_DATE: ${{ github.event.inputs.date }}
        run: |
          if [ -n "$IN_DATE" ]; then
            if ! [[ "$IN_DATE" =~ ^[0-9]{8}$ ]]; then
              echo "invalid date '$IN_DATE' (expected YYYYMMDD)"; exit 1
            fi
            python scripts/predict_today.py --date "$IN_DATE"
          else
            python scripts/predict_today.py
          fi
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/races data/fan data/model docs
          git diff --cached --quiet || git commit -m "daily update $(TZ=Asia/Tokyo date +%Y%m%d)"
          git pull --rebase --autostash -X theirs
          git push
