<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1B2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>アリテイ | 競艇AI予測</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0B1B2B; --surface:#122638; --surface2:#1A3349; --line:#23425C;
  --text:#E8EEF4; --dim:#8FA6BA; --accent:#2FA8FF;
  --confA:#F5B82E; --confB:#5BC0DE; --confC:#5B6B7A;
  --b1:#F2F4F6; --b2:#15181C; --b3:#E5333C; --b4:#1F6FEB; --b5:#F5C518; --b6:#19A974;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:15px;line-height:1.5}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
#app{max-width:480px;margin:0 auto;height:100%}
/* 全タブ共通で#main自身を内部スクロール化(ページ全体を常にビューポート内に収める)。
   iOSのウィンドウスクロール位置の非同期復元ズレの根治に加え、SafariのURLバー伸縮で
   下部ナビが上下に動くのを防ぐ(全タブでナビ位置が固定される)。 */
#main{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
/* iOSはbodyのoverflow:hiddenを無視してウィンドウをスクロールできるため、
   position:fixedで常時完全ロックする(モーダルと同じ手法)。 */
body{position:fixed;inset:0;overflow:hidden;width:100%}
header{position:sticky;top:0;z-index:20;background:#0B1B2B;
  backdrop-filter:blur(8px);
  padding:calc(10px + env(safe-area-inset-top)) 16px 4px}
header h1{font-size:18px;font-weight:800;letter-spacing:.04em}
header h1 span{color:var(--accent)}
#hdrVer{flex:0 0 auto;font-size:10px;color:var(--dim);font-weight:600;align-self:flex-end;margin:0 0 2px -6px;letter-spacing:0}
#hdrVer:empty{display:none}
#hdrDate{color:var(--dim);font-size:12px;margin-top:2px}
#hdrMeta{color:var(--dim);font-size:11px;margin-top:1.6px;display:block;position:relative}
#hdrMetaTxt{white-space:pre-line}
#dateNav{margin-left:auto;display:flex;align-items:center;gap:3px;position:relative}
#dateNav .dnav{background:var(--surface);border:1px solid var(--line);color:var(--text);width:25px;height:25px;border-radius:8px;font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0 0 4px 0}
#dateNav .dnav:disabled{opacity:.35;cursor:default}
#dateNav .dsel{display:flex;align-items:center;justify-content:flex-start;gap:2px;width:120px;height:25px;position:relative;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:0 5px 0 8px;font-size:11px;font-weight:700;line-height:1;cursor:pointer;white-space:nowrap}
#dateNav .dsel .car{color:var(--dim);font-size:20px;position:absolute;right:6px;top:50%;transform:translateY(-50%)}
#dMenu{position:absolute;top:calc(100% + 6px);left:28px;z-index:30;width:120px;max-height:50vh;overflow-y:auto;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.45);-webkit-overflow-scrolling:touch}
#dMenu[hidden]{display:none}
#dMenu .dopt{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:none;color:var(--text);padding:9px 12px 9px 4px;font-size:11px;border-radius:6px;cursor:pointer;white-space:nowrap}
#dMenu .dopt:hover{background:var(--surface)}
#dMenu .dopt.on{background:var(--accent);color:#06121E;font-weight:700}
#dMenu .dtoday{font-size:10px;color:var(--dim)}
#dMenu .dopt.on .dtoday{color:#06121E}

nav{position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:rgba(11,27,43,.95);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:none;color:var(--dim);
  padding:6px 0 4px;font-size:11px;line-height:1.2;font-weight:600;cursor:pointer}
nav button.on{color:var(--accent)}
nav button svg{display:block;margin:0 auto 2px;width:20px;height:20px;
  stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* ホーム画面起動(standalone)ではバー下端=実画面最下部(実測確認済み)。
   env(safe-area-inset-bottom)分の余白はホームバー安全圏だが、マスターの意向で
   限界まで詰める(固定6px)。ボタンはホームバー(白い横棒)とわずかに重なり得る。 */
@media (display-mode: standalone){nav{padding-bottom:6px}}

.hdrtop{display:flex;align-items:center;gap:10px}.hdrtop h1{flex:0 0 auto;margin:0}
/* アプリアイコン: h1の行高(18px x 1.5 = 27px)以内に収め、ヘッダーの縦幅を変えない */
#hdrIcon{flex:0 0 auto;width:26px;height:26px;border-radius:7px;display:block;margin-right:-2px}#hdrChips{position:absolute;top:0;right:0;display:flex;justify-content:flex-end}#hdrChips:empty{display:none}#venSel{display:flex;justify-content:space-between;width:148px;height:25px;margin-top:8px;align-self:center;align-items:center;gap:2px;max-width:100%;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:2px 5px 2px 12px;font-size:14px;font-weight:700;line-height:1.2;cursor:pointer;white-space:nowrap}#venSel .car{color:var(--dim);font-size:20px}#venMenu{position:absolute;top:calc(100% + 6px);right:0;z-index:30;width:152px;max-height:50vh;overflow-y:auto;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.45);-webkit-overflow-scrolling:touch}#venMenu[hidden]{display:none}.venopt{display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);padding:9px 12px;font-size:14px;border-radius:6px;cursor:pointer;white-space:nowrap}.venopt:hover{background:var(--surface)}.venopt.on{background:var(--accent);color:#06121E;font-weight:700}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);
  color:var(--text);border-radius:999px;padding:7px 14px;font-size:13px;
  font-weight:600;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#06121E}

.racelist{padding:0 16px}.racelist>.race:first-child{margin-top:7px}
.race{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  margin-bottom:7px;overflow:hidden}
.race.cand{border-style:dashed;border-color:#3B5A74}
.conf.candb{background:transparent;border:1px solid #3B5A74;color:var(--dim);font-weight:700}
/* 確定済み・未決着レース: 判定/結果のプレースホルダ領域を使って確定時刻を表示。
   min-widthは判定セル+gap+結果セル(60px)ぶんを確保し、決着済みカードと列位置を揃える */
.stfixc{min-width:85px;justify-content:center;font-weight:700}
/* 確定予定(候補)は未確定の予告なので、確定済みの時刻より控えめに見せる */
.stfixe{color:var(--dim);font-weight:600}
.race.skip{opacity:.55}
/* カード全体がタップ可能(見送りカード)。押下時に軽く反応させる */
.racelist.sengen .race.jumpcard,.racelist.sengen .race.jumpcard .racehead{cursor:pointer}
.race.jumpcard:active{background:var(--surface2)}
.skiphead{font-size:9px;color:var(--dim);padding:10px 16px 3px;letter-spacing:.02em}
.rsreason{font-size:9px;color:var(--dim);white-space:nowrap}
/* 見送りカード: 確定予定〜払戻金の幅をまとめて理由の記載に使う */
.rscell{min-width:152px;justify-content:center;text-align:center}
.rscell .rsreason{font-size:11px;white-space:normal;line-height:1.35}
.racehead{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer}.racelist.sengen .racehead{cursor:default}
.rno{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;font-size:16px;font-weight:800;min-width:34px}
.rven{font-size:10px;font-weight:600;color:var(--dim);line-height:1.1;margin-top:2px;letter-spacing:.02em}
.rno.jump{cursor:pointer;border-radius:8px;padding:2px 6px;margin:-2px -6px;transition:background .15s}
.rno.jump:active{background:rgba(91,192,222,.26)}
@keyframes flashbg{0%{background:rgba(91,192,222,.30)}100%{background:transparent}}
.race.flash{animation:flashbg 1.5s ease}
.rmeta{flex:1;min-width:0}
.rtype{font-size:12px;color:var(--dim);display:inline-block;max-width:100%;white-space:nowrap;overflow:hidden;vertical-align:bottom}
.rdl{font-size:11px;color:var(--dim)}
.honmei{display:flex;gap:3px;align-items:center}
.conf{font-size:11px;font-weight:800;border-radius:6px;padding:3px 4px;min-width:47px;box-sizing:border-box;text-align:center}
.confA{background:var(--confA);color:#1A1200}
.confB{background:var(--confB);color:#04222C}
.senp{font-size:12px;font-weight:800;border-radius:6px;padding:3px 8px;background:#1FB97A;color:#04150C}
.livechip{font-size:9px;font-weight:800;border-radius:5px;padding:2px 5px;background:#7C4DFF;color:#fff;line-height:1.4;white-space:nowrap}.voidchip{font-size:9px;font-weight:800;border-radius:5px;padding:2px 5px;background:#E53935;color:#fff;line-height:1.4;white-space:nowrap}
.exv{min-width:34px;text-align:right;font-size:11px;color:var(--dim)}
.oddv{font-size:11px;color:#FFC53D;margin-left:6px;display:inline-block;min-width:42px;text-align:right;white-space:nowrap}
.hitchip{font-size:10px;font-weight:800;border-radius:5px;padding:2px 6px;background:#1FB97A;color:#04150C;margin-left:4px}
.misschip{font-size:10px;font-weight:800;border-radius:5px;padding:2px 6px;background:#E5484D;color:#fff;margin-left:4px}
.resv{font-size:12px;font-weight:600;color:#7dd3fc;background:rgba(56,189,248,.12);padding:1px 7px;border-radius:5px}
.vlabel{font-size:11px;color:var(--mut,#8FA3B8);display:block}
.confC{background:var(--confC);color:#0B1B2B}
.actR{background:#FFFFFF;color:#111417}.actM{background:#111417;color:#FFFFFF}
.lane{display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:5px;font-size:13px;font-weight:800;
  font-variant-numeric:tabular-nums}
.lane.s{width:18px;height:18px;font-size:11px;border-radius:4px}
.l1{background:var(--b1);color:#10141A}
.l2{background:var(--b2);color:#F2F4F6;box-shadow:inset 0 0 0 1px #3A4654}
.l3{background:var(--b3);color:#fff}
.l4{background:var(--b4);color:#fff}
.l5{background:var(--b5);color:#231A00}
.l6{background:var(--b6);color:#04231A}
.racebody{display:none;border-top:1px solid var(--line);padding:8px 14px 12px}
.race.open .racebody{display:block}
.resbox{background:rgba(56,189,248,.07);border:1px solid rgba(56,189,248,.35);border-radius:10px;padding:10px 12px;margin:0 0 12px}
.resttl{font-size:11px;font-weight:700;letter-spacing:.08em;color:#7dd3fc;margin-bottom:6px}
.resrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.reschips{display:inline-flex;gap:3px}
.reskime{font-size:13px;color:#cbd5e1}
.respay{font-size:13px;color:#e2e8f0;margin-left:auto}
.respay b{color:#fde047;font-size:15px}
.rgrid{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.rcol{display:flex;flex-direction:column;gap:4px;align-items:center}
.rhd{font-size:9px;letter-spacing:.08em;color:var(--dim)}
.rcombo{display:inline-flex;gap:3px}
.rjudge{font-size:22px;font-weight:800;line-height:1}
.jhit{color:#34D399}
.jmiss{color:#F87171}
.rsub{margin-top:9px;font-size:11px;color:#94a3b8;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rtag{background:rgba(52,211,153,.15);color:#34D399;border:1px solid rgba(52,211,153,.4);border-radius:6px;padding:1px 6px;font-size:10px}
.rwait{color:var(--dim);opacity:.55}
.hjp{display:flex;gap:9px;align-items:flex-start;flex-shrink:0}
.hjc{display:flex;flex-direction:column;align-items:center;gap:6px}
.hjl{font-size:8px;letter-spacing:.04em;color:var(--dim);line-height:1}
.hjv{display:inline-flex;gap:3px;align-items:center;min-height:18px;font-size:12px}.hjp>.hjc:nth-child(-n+3)>.hjv{margin-top:4px}
.hjw{min-width:60px;justify-content:center}
.lph{background:rgba(140,160,180,.08);box-shadow:inset 0 0 0 1px rgba(140,160,180,.22)}
.rj2{font-size:15px;font-weight:800;line-height:1}
.resbadges{display:flex;gap:6px;flex-wrap:wrap}
.rbadge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px}
.rb-hit{background:#16a34a;color:#fff}
.rb-miss{background:rgba(148,163,184,.18);color:#94a3b8}

.sec{font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.08em;margin:8px 0 6px}.racebody>.sec:first-child{margin-top:0}
.boatrow{display:grid;grid-template-columns:auto minmax(0,1fr) 32px 46px 48px 32px 40px;align-items:center;column-gap:6px;padding:4px 0}
.bname{min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bcls{justify-self:start;font-size:11px;color:var(--dim)}.bbar{height:7px;background:var(--surface2);border-radius:4px;overflow:hidden}.bbar i{display:block;height:100%;background:var(--accent);border-radius:4px}.bst{justify-self:end;text-align:right;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}.bex{justify-self:end;text-align:right;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}.sechead{padding:0;margin:8px 0 6px}.sectitle{grid-column:1/6;font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.08em}.bh{justify-self:end;text-align:right;font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.08em}.fstart{color:#FF5252}.wxinfo{font-size:11px;color:var(--dim);margin:-2px 0 7px;letter-spacing:.01em}.warr{display:inline-block;font-style:normal;color:var(--text)}
.bar{flex:0 0 96px;height:7px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bp{min-width:42px;text-align:right;font-size:12px;font-weight:700}
.pickrow{display:flex;align-items:center;gap:8px;padding:3px 0}.pickrow.pwin{background:rgba(31,185,122,.16);border-radius:6px;margin:0 -6px;padding:3px 6px}
.prank{min-width:18px;color:var(--dim);font-size:11px;text-align:right}
.pickrow .bar{flex:1}
.pickrow .bar i{background:#3D7FB8}
.pickrow:first-of-type .bar i{background:var(--accent)}

.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.card .v{font-size:22px;font-weight:800}
.card .k{font-size:11px;color:var(--dim);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:600;font-size:11px}
th:first-child,td:first-child{text-align:left}.acctbl{width:100%;table-layout:fixed;border-collapse:collapse}.acctbl th,.acctbl td{text-align:center;vertical-align:middle;padding:2px 3px;line-height:1.35;overflow-wrap:break-word;border-bottom:0}.acctbl tr.stkrow:first-child th{padding:6px 3px 4px}.acctbl tr.blast>th,.acctbl tr.blast>td{box-shadow:inset 0 -1px 0 var(--line)}.acctbl td.dcell{vertical-align:middle;text-align:center;box-shadow:inset 0 -1px 0 var(--line)}.acctbl td.plab{color:var(--dim);font-weight:700;white-space:nowrap}
.acctbl .stkrow th,.acctbl .stkrow td{position:sticky;z-index:5;background-color:var(--bg);border-bottom:0}.acctbl tr.tblk>th,.acctbl tr.tblk>td{background-color:var(--surface)}.acctbl tr.pmid>td{background-image:repeating-linear-gradient(90deg,var(--line) 0 3px,transparent 3px 7px),repeating-linear-gradient(90deg,var(--line) 0 3px,transparent 3px 7px);background-position:left top,left bottom;background-size:100% 1px,100% 1px;background-repeat:no-repeat}.acctbl tr.stkend>th,.acctbl tr.stkend>td{box-shadow:inset 0 -2px 0 rgba(47,168,255,.55)}.acctbl td.dcell.dend{box-shadow:inset 0 -2px 0 rgba(47,168,255,.55)}.acctbl tr.mrow{cursor:pointer}
#senCount .anote{grid-column:1/-1;text-align:right;font-size:8px;line-height:1.45;font-weight:400;color:var(--dim);white-space:nowrap}
.pad{padding:0 16px}
.accwrap{padding:0 4px}
.accwrap .acctbl td>br+span{white-space:nowrap}
.note{color:var(--dim);font-size:13px;padding:32px 24px;text-align:center;line-height:1.8}.race.gap{opacity:.55}.gapnote{margin-left:auto;color:var(--dim);font-size:12px}.venopt.off{opacity:.4;color:var(--dim);cursor:default;pointer-events:none}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
/* 設定タブの折りたたみ(用語説明/モデル詳細) */
.term{padding:8px 0;border-bottom:1px solid var(--line);font-size:12px;line-height:1.7}
.term b{display:block;font-size:12.5px}
.term span{color:var(--dim)}
.setdet{margin-top:18px;border-top:1px solid var(--line)}
.setdet summary{list-style:none;cursor:pointer;padding:12px 0;font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.setdet summary::-webkit-details-marker{display:none}
.setdet summary::after{content:"▾";color:var(--dim)}
.setdet[open] summary::after{content:"▴"}
.kv span:first-child{color:var(--dim)}
.warn{margin:10px 16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  color:var(--dim);font-size:11px;line-height:1.7}
#senCount{position:absolute;right:16px;bottom:5px;margin:0;font-size:15px;line-height:1.35;font-weight:700;display:grid;grid-template-columns:auto auto;column-gap:4px;justify-items:end;align-items:baseline;color:var(--dim)}#senCount .ssl{color:var(--dim);font-weight:300}.ssk{display:inline-block;width:3.25em;text-align:justify;text-align-last:justify}#senCount .ssv{color:var(--confA);font-weight:500;font-variant-numeric:tabular-nums}#senCount:empty{display:none}.tswb{flex:1;background:var(--surface);border:1px solid var(--line);color:var(--dim);border-radius:10px;padding:8px 0;font-size:13px;font-weight:700;cursor:pointer}.tswb.on{background:var(--confA);border-color:var(--confA);color:#1A1200}.tierrow{display:flex;gap:8px;padding:10px 16px 2px}#todayMeta{position:absolute;right:0;top:0;margin:0;font-size:11px;line-height:16.5px;font-weight:400;display:grid;grid-template-columns:auto auto auto;column-gap:0;align-items:baseline;color:var(--dim)}#todayMeta .tml{justify-self:end;color:var(--dim);font-weight:400}#todayMeta .tmv{justify-self:end;color:var(--confA);font-weight:400;font-variant-numeric:tabular-nums;white-space:nowrap}#todayMeta .tmn{justify-self:start;color:var(--dim);font-weight:400;white-space:nowrap}#todayMeta:empty{display:none}
.spin{width:28px;height:28px;border:3px solid var(--surface2);border-top-color:var(--accent);
  border-radius:50%;margin:48px auto;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

<script>
const $=s=>document.querySelector(s);
// 厳選: 3連単TOP3の3点(300円)買い。TOP3合計確率が高く・除外会場でなく・上位3点のオッズが一定以上の
// 水面が安定したレースのみを厳選する。閾値/除外会場は過去実績のtrain/test検証で決定(scripts/common.py とミラー)。
const SENGEN_TOP3P_MIN=0.36, SENGEN_MIN_ODDS=3.1, SENGEN_EXCLUDE=[3,4,14];
// 松(プレミア・TOP4の4点買い)は2026-09-01で終売。判定ロジックは撤去済みで、表示からも
// 全撤去済み(マスターの指示)。過去実績はaccuracy.jsonのprm_*とgit履歴にそのまま残る。
const VIEW={today:null,acc:null,model:null,calib:null};
let cur="today", pred=null, selVenue=null, todayMode="time";
let viewPred=null, dateList=null, latestDate=null, dateNavBusy=false, dnavDocBound=false, venDocBound=false;
let CALIB=null; // 較正表(docs/calib.json、毎朝自動再計算)。起動時にfetchJSONで読み込み、失敗時はnullのまま(内蔵表にフォールバック)
let showGen=0,autoRefreshing=false;
let accOpenM={},accResizeBound=false; // 的中実績: 過去月の折りたたみ開閉状態 / resizeリスナー二重登録防止
const PREDS={};
const _WD=["日","月","火","水","木","金","土"];
// Web Push通知: PUSH_WORKERが空文字の間はデプロイ未完了とみなし、機能全体を非表示にする(休眠状態)。
// デプロイ後にオーケストレータがWorker URLを設定して有効化する。
const PUSH_WORKER="";
const VAPID_PUB="BBwe0VKS6ZoMa4CDjXDpKHvp5xPR9okvoPQCQGQfZdmX8JcIBAls-FuE3qOGFd7b2dPbxI9T0XWYHsJDqvby3hQ";
function urlBase64ToUint8Array(base64String){
  const padding="=".repeat((4-base64String.length%4)%4);
  const base64=(base64String+padding).replace(/-/g,"+").replace(/_/g,"/");
  const raw=atob(base64);
  const arr=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);
  return arr;
}

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const laneChip=(n,s)=>`<span class="lane ${s?'s':''} l${n}">${n}</span>`;
const comboChips=(c,s)=>c.split("-").map(n=>laneChip(n,s)).join("");
const pct=p=>(p*100).toFixed(1)+"%";
const wfmt=v=>v==null?"-":(Math.round(v*10)/10).toFixed(1);
const windArrow=n=>(n==null||n>16)?"":` <span class="warr" style="transform:rotate(${(n-1)*22.5}deg)">↑</span>`;
const confCls=p=>p>=0.9?"confA":p>=0.8?"confB":"confC";
const top5p=r=>r.picks?r.picks.slice(0,5).reduce((a,p)=>a+(p.p||0),0):0;
const top3p=r=>r.picks?r.picks.slice(0,3).reduce((a,p)=>a+(p.p||0),0):0;
// バッジ色分け(較正後の実測確率基準): 金=50%以上(半分以上当たる帯のみ)/青=40〜49%/灰=それ未満
const cumCls=p=>p>=0.5?"confA":p>=0.4?"confB":"confC";
// 的中率バッジの較正: モデル確率(表示%)を過去8,418レースの実測的中率へ写像(区分線形)。
// 序盤(1〜4R)はモデルの高確率帯が信用できない(40%超表示でも実測36〜44%で頭打ち)ため、
// 1〜4R用(E)と5R以降用(L)の別テーブルを適用。単調性はisotonic回帰で保証。
// 選定ロジック(生のtop3p/top4p閾値)には一切使わず、バッジ表示のみに適用。2026-08-03算出。
// フォールバック値。正はdocs/calib.json(毎朝自動再計算)。calib.json未取得/対象キー欠落時のみ使用。
const CAL_T5E=[[7.5,11.2],[17.5,20.8],[22.5,26.1],[27.5,32.9],[32.5,39.6],[37.5,43.9],[42.5,43.9],[47.5,43.9],[75,57.7]];
const CAL_T3E=[[5,7.6],[12.5,14.8],[17.5,21.9],[22.5,27.4],[27.5,33.3],[33,33.3],[68,36]];
const CAL_T4E=[[6,9.6],[15,19.2],[21,24.3],[27,33.6],[33,39.3],[39,39.3],[71,39.3]];
const CAL_T5L=[[7.5,4.6],[17.5,17.8],[22.5,21.3],[27.5,30.3],[32.5,37.9],[37.5,43.9],[42.5,52.2],[47.5,56.7],[75,56.7]];
const CAL_T3L=[[5,3.3],[12.5,12.3],[17.5,17.4],[22.5,26.1],[27.5,33.9],[33,41.9],[68,44.9]];
const CAL_T4L=[[6,2.9],[15,13.9],[21,22.6],[27,30.7],[33,38.3],[39,48.6],[71,49]];
const _CAL_FALLBACK={t5e:CAL_T5E,t5l:CAL_T5L,t3e:CAL_T3E,t3l:CAL_T3L,t4e:CAL_T4E,t4l:CAL_T4L};
// CALIB(calib.json)に該当キーがあればそれを使い、無ければ内蔵フォールバック表を使う
const _tb=k=>(CALIB&&CALIB[k]&&CALIB[k].length)?CALIB[k]:_CAL_FALLBACK[k];
function calPct(p,tbl){const x=p*100;if(x<=tbl[0][0])return Math.round(tbl[0][1]*x/tbl[0][0]);for(let i=1;i<tbl.length;i++){if(x<=tbl[i][0]){const a=tbl[i-1],b=tbl[i];return Math.round(a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0]));}}return Math.round(tbl[tbl.length-1][1]);}
const calT5=r=>calPct(top5p(r),_tb(r.no<=4?"t5e":"t5l"));
// 全レース(当日予測)のバッジは「行動の推奨」を2段階で表示する。
// 注目=較正40%以上(買うか検討する価値。結果の約束は含まない語) / 様子見=それ以外。
// 旧「勝負」(厳選条件そのもの)は有料プランの選定を無料タブに漏らすため廃止。
// T-15打刻(r.att)があればそれを最優先(打刻後にライブ再予測で確率が動いても表示と
// 実績集計が食い違わないように)。打刻前は従来通りその時点の較正値で判定する。
const actLbl=r=>r.att!=null?(r.att?"注目":"様子見"):(calT5(r)>=40?"注目":"様子見");
// 全レースバッジ専用配色(厳選の%バッジの金/青/灰と混同しないよう別系統): 注目=紫/様子見=沈色
const actCls=v=>v==="注目"?"actR":"actM";
const calT3=r=>calPct(top3p(r),_tb(r.no<=4?"t3e":"t3l"));
const t5hit=r=>!!(r.result&&r.picks&&r.picks.slice(0,5).some(p=>p.c===r.result.order));
const t3hit=r=>!!(r.result&&r.picks&&r.picks.slice(0,3).some(p=>p.c===r.result.order));

function dayLabel(v){if(!v)return "";if(v.is_final)return " \u00b7 \u6700\u7d42\u65e5";if(v.day_n===1)return " \u00b7 \u521d\u65e5";if(v.day_n>1)return " \u00b7 "+v.day_n+"\u65e5\u76ee";return "";}
function sortVenues(p){if(p&&Array.isArray(p.venues))p.venues.sort((a,b)=>(a.code||0)-(b.code||0));return p;}
async function fetchJSON(url){
  const r=await fetch(url+"?t="+Date.now());
  if(!r.ok) throw new Error(url+" "+r.status);
  return r.json();
}

function setHeader(p){
  p=p||pred;
  if(!p) return;
  const d=p.date;
  $("#hdrDate").textContent=`${d.slice(0,4)}/${d.slice(4,6)}/${d.slice(6,8)} の予測`;
  const mt=$("#hdrMetaTxt");if(mt)mt.textContent=`予測生成：${p.generated_at||"-"}\n学　　習：${p.model_trained_at||"-"}`;
}

function axisTable(r){ return ""; }
// 厳選判定: 序盤1-4Rはモデルの高確率帯が信用できない(較正で実証)ため、5R以降のみ対象とする。
function sengenOk(r,vcode){
  // チェックポイント確定スタンプ最優先(締切15分前に確定しレース直下へ焼き込み、以後不変)
  if(r.tk!=null)return !!r.tk;
  // 確定時スタンプ(旧・本日分互換。パイプライン競合による遡及改変から所属を守る)
  if(r.result&&!r.result.status&&r.result.tk!=null)return !!r.result.tk;
  if(r.no<5)return false;if(top3p(r)<SENGEN_TOP3P_MIN||SENGEN_EXCLUDE.indexOf(vcode)>=0)return false;return r.picks.slice(0,3).every(function(p){var o=pickOdds(r,p.c);return o==null||o>=SENGEN_MIN_ODDS;});}
function fitRtype(){document.querySelectorAll(".rtype").forEach(el=>{el.style.fontSize="";let fs=12,g=0;while(el.scrollWidth>el.clientWidth+0.5&&fs>8&&g<24){fs-=0.5;el.style.fontSize=fs+"px";g++;}});}
// 買い目の実効オッズ(表示・厳選の価値判定の共通基準): 確定済みレース(中止除く)の
// 的中買い目は、暫定オッズ(prov)が最終に更新されず残る場合があるため、実配当(pay3t/100)を
// 優先する。それ以外(未確定/外れ買い目)は取得済みt3オッズを使う。sengenOk はこの値で
// 3.1倍未満を除外するため、実配当が3.1倍未満だった上位3点の的中は厳選から自動的に外れる。
function pickOdds(r,c){
  if(r.result&&!r.result.status&&r.result.pay3t>0&&c===r.result.order){return Math.round(r.result.pay3t/10)/10;}
  return (r.odds&&r.odds.t3)?r.odds.t3[c]:null;
}
// 買い目行の表示用オッズ(文字列)。厳選は締切15分前の板で判定するため、判定に使った
// 値(r.os)を出さないと「3.1倍以上のはずなのに2.9倍と書いてある」という矛盾に見える。
// 一方その板は締切までに動くので、的中買い目は「判定時→実配当」を併記して両方見せる。
// odds.t3 は締切後に確定オッズへ書き換わるので決着後の表示には使わない。
function decOddsText(r,c){
  const isWin=!!(r.result&&!r.result.status&&r.result.pay3t>0&&c===r.result.order);
  const act=isWin?pickOdds(r,c):null;
  // 判定時点で板が無かった買い目(値がnull)は確定オッズで埋めない。
  // 「オッズ未取得だから見送り」の根拠そのものなので、倍率を出さないのが正しい。
  const dec=(r.os&&Object.prototype.hasOwnProperty.call(r.os,c))?r.os[c]:(isWin?null:pickOdds(r,c));
  if(dec!=null&&act!=null&&Math.abs(dec-act)>=0.05)return dec+"→"+act+"倍";
  if(act!=null)return act+"倍";
  if(dec!=null)return dec+"倍";
  return null;
}
function renderSengen(){
  const m=$("#main");
  if(!pred){m.innerHTML='<div class="spin"></div>';return}
  setHeader();
  const list=[];
  // 見送り: 確率条件は通ったがオッズ条件で不成立(rs=理由文字列)となった準候補。
  // tk/mtどちらも成立していないレースのみ対象(成立したプランがあれば通常の候補/確定側に出る)。
  const skipList=[];
  (pred.venues||[]).forEach(v=>v.races.forEach(r=>{
    if(sengenOk(r,v.code))list.push({v,r});
    // 見送りは厳選(竹)の理由のみ表示する。松の終売(2026-09-01)以前に焼き込まれた
    // 松系の理由(帯超え/下限割れ/オッズ未達)は売っていないプランの見送りなので出さない。
    if(r.rs&&r.rs.indexOf("3.1倍未満")===0&&r.tk!==1)skipList.push({v,r});
  }));
  list.sort((a,b)=>(a.r.deadline||"99:99").localeCompare(b.r.deadline||"99:99"));
  skipList.sort((a,b)=>(a.r.deadline||"99:99").localeCompare(b.r.deadline||"99:99"));
  {const _tm=$("#todayMeta");if(_tm){
    const hit=list.filter(x=>t3hit(x.r)).length;
    _tm.innerHTML=`<span class="tml">本　日：</span><span class="tmv">${list.length}件</span><span class="tmn"></span><span class="tml">的　中：</span><span class="tmv">${hit}件</span><span class="tmn"></span>`;
  }}
  // 見送りカード: racebody無しの1行カード。買い目が無く展開する中身が無いため、
  // カード全体をタップで当日予測の該当レースへ移動する(jumpcard)。
  const _skipCf=({v,r})=>{
    return `<div class="race skip jumpcard" data-vc="${v.code}" data-rn="${r.no}">
      <div class="racehead">
        <span class="rno num jump" data-vc="${v.code}" data-rn="${r.no}"><span class="rnum">${r.no}R</span><span class="rven">${esc(v.name)}</span></span>
        <span class="rmeta"><span class="rtype">${esc(r.type||"")}</span><br>
          <span class="rdl num">締切 ${r.deadline||"-"}</span></span>
        <span class="hjp"><span class="hjc"><span class="hjl">判　断</span><span class="hjv"><span class="conf candb">見送り</span></span></span><span class="hjc"><span class="hjl">理　由</span><span class="hjv rscell"><span class="rsreason">${esc(r.rs||"")}</span></span></span></span>
      </div>
    </div>`;
  };
  const skipHtml=skipList.length?(`<div class="skiphead">見送り</div>`+skipList.map(_skipCf).join("")):"";
  if(!list.length){
    m.innerHTML=`<div class="note">本日の厳選対象レースはありません。</div>`+(skipList.length?`<div class="racelist sengen">${skipHtml}</div>`:"");
    if(skipList.length){
      requestAnimationFrame(fitRtype);
      _wireSengenJump(m);
    }
    return;
  }
  const _cf=({v,r})=>{
    const hit=t3hit(r);
    const fav=r.fuku||{};
    const fb=r.boats.find(b=>b.lane===fav.lane)||{};
    const top=r.picks[0]||{c:"-",p:0};
    // チェックポイント確定スタンプの有無(所属が締切15分前に確定済みか)。
    // 旧・res側スタンプ(本日分互換)のみで成立している場合は候補/確定どちらの表示も出さない
    // (従来通りの見た目を維持)。
    const stampFixed=(r.tk!=null);
    const legacyFixed=!!(r.result&&!r.result.status&&r.result.tk!=null);
    // 候補=未確定(スタンプ無し・結果も無し)。数字は確定するまで出さない:
    // 的中率枠には「候補」を表示し、確定/決着後に初めて較正%を刻む(以後不変)。
    const isCand=!stampFixed&&!legacyFixed&&!r.result;
    // 確定済みは的中率/判定/結果/払戻金の4項目のみ(確定時刻は締切から一意に定まる
    // ため画面には出さない。r.pt自体はJSONに焼き込まれ改ざん不可の証跡として残る)。
    // 候補のみ判定・結果の空き枠をまとめて確定予定時刻(締切15分前)の表示に使う。
    const etaTime=isCand?_stampEta(r.deadline):null;
    const candHtml="";
    const badgeHtml=isCand
      ?`<span class="conf candb">候補</span>`
      :`<span class="conf ${cumCls(calT3(r)/100)}">${calT3(r)}%</span>`;
    const picks=r.picks.slice(0,3).map((p,i)=>
      `<div class="pickrow${(r.result&&!r.result.status&&p.c===r.result.order)?' pwin':''}"><span class="prank num">${i+1}</span>
        <span class="honmei">${comboChips(p.c,true)}</span>
        <span class="bar"><i style="width:${Math.min(100,p.p/r.picks[0].p*100)}%"></i></span>
        <span class="bp num">${pct(p.p)}</span>${(()=>{const _o=decOddsText(r,p.c);return _o?`<span class="oddv num">${_o}</span>`:"";})()}</div>`).join("");
    return `<div class="race open${isCand?' cand':''}">
      <div class="racehead">
        <span class="rno num jump" data-vc="${v.code}" data-rn="${r.no}"><span class="rnum">${r.no}R</span><span class="rven">${esc(v.name)}</span></span>
        <span class="rmeta"><span class="rtype">${esc(r.type||"")}</span>${candHtml}<br>
          <span class="rdl num">締切 ${r.deadline||"-"}</span></span>
        <span class="hjp"><span class="hjc"><span class="hjl">${isCand?"判　断":"的中率"}</span><span class="hjv">${badgeHtml}</span></span>${etaTime?`<span class="hjc"><span class="hjl">確定予定</span><span class="hjv stfixc stfixe num">${esc(etaTime)}</span></span>`:`<span class="hjc"><span class="hjl">判定</span><span class="hjv">${(r.result&&!r.result.status)?`<span class="rj2 ${hit?"jhit":"jmiss"}">${hit?"〇":"✕"}</span>`:'<span class="rwait">—</span>'}</span></span><span class="hjc"><span class="hjl">結果</span><span class="hjv hjw">${(r.result&&r.result.status)?'<span class="voidchip">'+esc(r.result.status)+'</span>':r.result?comboChips(r.result.order,true):((r.live||r.st_ex)?'<span class="livechip">展示反映</span>':'<span class="lane s lph"></span><span class="lane s lph"></span><span class="lane s lph"></span>')}</span></span>`}<span class="hjc"><span class="hjl">払戻金</span><span class="hjv" style="font-weight:700;min-width:58px;justify-content:center;font-variant-numeric:tabular-nums">${r.result&&r.result.pay3t!=null?'¥'+r.result.pay3t.toLocaleString():'<span class="rwait">—</span>'}</span><span class="hjl" style="margin-top:-6px">${r.result&&r.result.ninki!=null?r.result.ninki+'番人気':''}</span></span></span>
      </div>
      <div class="racebody">
        ${picks||'<div class="note" style="padding:6px 0;text-align:left">買い目データなし</div>'}
      </div></div>`;
  };
  const openL=list.filter(x=>_isOpen(x.r,pred.date)),doneL=list.filter(x=>!_isOpen(x.r,pred.date));
  const cards=doneL.map(_cf).join("")+openL.map(_cf).join("");
  m.innerHTML=`<div class="racelist sengen">${cards}${skipHtml}</div>`;
  requestAnimationFrame(fitRtype);
  _wireSengenJump(m);
}

// 厳選一覧→当日予測へのジャンプ: 会場を切替えて該当レースを開き、位置を合わせて点滅させる。
// 描画完了を待つため35msごとに最大40回まで対象カードを探す。
function _jumpToRace(vc,rn){
  selVenue=+vc;todayMode="venue";
  show("today");

function _stampEta(deadline){
  if(!deadline||deadline.indexOf(":")<0) return null;
  const p=deadline.split(":"),h=+p[0],mi=+p[1];
  if(!isFinite(h)||!isFinite(mi)) return null;
  let t=h*60+mi-15;
  if(t<0) t+=1440;
  return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0");
}

function _isOpen(r,dateStr){

    const s={races:0,top5_hit:0,sen_n:0,sen_hit:0,prm_n:0,prm_hit:0,stake5:0,return5:0,sen_stake:0,sen_ret:0,prm_stake:0,prm_ret:0,att_n:0,att_hit:0,att_stake:0,att_ret:0,yos_n:0,yos_hit:0,yos_stake:0,yos_ret:0};
    list.forEach(d=>{s.races+=d.races||0;s.top5_hit+=d.top5_hit||0;s.sen_n+=d.sen_n||0;s.sen_hit+=d.sen_hit||0;s.prm_n+=d.prm_n||0;s.prm_hit+=d.prm_hit||0;s.stake5+=d.stake5||0;s.return5+=d.return5||0;s.sen_stake+=d.sen_stake||0;s.sen_ret+=d.sen_ret||0;s.prm_stake+=d.prm_stake||0;s.prm_ret+=d.prm_ret||0;s.att_n+=d.att_n||0;s.att_hit+=d.att_hit||0;s.att_stake+=d.att_stake||0;s.att_ret+=d.att_ret||0;s.yos_n+=d.yos_n||0;s.yos_hit+=d.yos_hit||0;s.yos_stake+=d.yos_stake||0;s.yos_ret+=d.yos_ret||0;});
    return s;
  };
  // プラン=行のブロック共通ビルダー: labelHTML(rowspanの日付/月セル)+全・厳選の2行分の<tr>を返す。
  // 松(2026-09-01終売)はマスターの指示で表示から全撤去(2026-09)。データ(accuracy.jsonの
  // prm_*)とgit履歴には全実績が残っており、表示を戻せばいつでも復元できる。
  // opts.cls: 全行に付与するclass名(空白区切り) / opts.dataM: 全行に付与するdata-m(月トグル判定・全行クリック対応用)
  const blockRows=(labelHTML,X,opts)=>{
    X=X||{};opts=opts||{};
    const races=X.races||0,t5=X.top5_hit||0,st5=X.stake5||0,rt5=X.return5||0;
    const sn=X.sen_n||0,sh=X.sen_hit||0,sst=X.sen_stake||0,sret=X.sen_ret||0;
    const cnt=(h,n)=>n?h.toLocaleString()+"/"+n.toLocaleString():"-";
    const rate=(h,n)=>n?(h/n*100).toFixed(1)+"%":"-";
    const roi=(st,rt)=>st?((rt||0)/st*100).toFixed(1)+"%":"-";
    const an=X.att_n||0,ah=X.att_hit||0,ast=X.att_stake||0,aret=X.att_ret||0;
    const yn=X.yos_n||0,yh=X.yos_hit||0,yst=X.yos_stake||0,yret=X.yos_ret||0;
    const rows=[{lab:"全R",cnt:cnt(t5,races),rate:rate(t5,races),roi:roi(st5,rt5)}];
    // 注目/様子見: 9/2以降はT-15打刻の実績、9/1以前は保存済み買い目への遡及集計
    // (2026-09-02に導入時点の較正で一括計算・以後再計算しない)。データのある期間のみ2行挿入。
    if(an+yn>0||ast+yst>0){
      rows.push({lab:"注目",cnt:cnt(ah,an),rate:rate(ah,an),roi:roi(ast,aret)});
      rows.push({lab:"様子見",cnt:cnt(yh,yn),rate:rate(yh,yn),roi:roi(yst,yret)});
    }
    rows.push({lab:"厳選",cnt:cnt(sh,sn),rate:rate(sh,sn),roi:roi(sst,sret)});
    const dm=opts.dataM!=null?' data-m="'+opts.dataM+'"':'';
    const last=rows.length-1;
    return rows.map((row,i)=>{
      const cls=(opts.cls?opts.cls+" ":"")+(i===last?"blast"+(opts.lastCls?" "+opts.lastCls:""):(i>0?"pmid":""));
      const clsAttr=cls.trim()?' class="'+cls.trim()+'"':'';
      const dcell=i===0?'<td rowspan="'+rows.length+'" class="dcell'+(opts.dcellCls?" "+opts.dcellCls:"")+'">'+labelHTML+'</td>':'';
      return '<tr'+clsAttr+dm+'>'+dcell+'<td class="plab"'+(row.lab.length>2?' style="font-size:10.5px"':'')+'>'+row.lab+'</td><td class="num">'+row.cnt+'</td><td class="num">'+row.rate+'</td><td class="num">'+row.roi+'</td></tr>';
    }).join("");
  };
  const headRow='<tr class="stkrow blast"><th>日付</th><th>プラン</th><th>的中/件数</th><th>的中率</th><th>回収率</th></tr>';
  const totalRows=days.length?blockRows('<span style="font-weight:700">累計</span>',tt,{cls:"stkrow tblk"}):"";
  const curOpen=!!accOpenM[curMKey];
  const curGroup=groups.find(g=>g.key===curMKey);
  // 当月集計は確定日に本日速報(未確定)を随時合算して表示する(翌朝確定値に置き換わる)
  const curList=(curGroup?curGroup.list:[]).concat((tj&&pred&&mkey(String(pred.date))===curMKey)?[tj]:[]);
  const curMonthRows=blockRows(mLabel(curMKey,curOpen),curList.length?sumMonth(curList):null,{cls:"stkrow mrow",dataM:curMKey,lastCls:"stkend",dcellCls:"dend"});
  // 本日速報の詳細行は当月の折りたたみに連動して表示/非表示(集計値は当月ブロックに合算済み)
  const todayRows=(tj&&curOpen)?blockRows(dlab2(pred.date)+'<br><span style="font-size:8px;color:var(--dim)">速報</span>',tj,{}):"";
  const curDayRows=(curOpen&&curGroup)?curGroup.list.map(d=>blockRows(dlab2(d.date),d,{})).join(""):"";
  const pastRows=groups.filter(g=>g.key!==curMKey).map(g=>{
    const open=!!accOpenM[g.key];
    // 月の途中からデータが始まる月(6月=13日〜等)はラベルに開始日を注記する
    const md=Math.min.apply(null,g.list.map(d=>+String(d.date).slice(6,8)));
    const mrows=blockRows(mLabel(g.key,open)+(md>1?'<span style="display:block;font-size:8px;color:var(--dim)">'+md+'日〜</span>':""),sumMonth(g.list),{cls:"mrow",dataM:g.key});
    const dayRows=open?g.list.map(d=>blockRows(dlab2(d.date),d,{})).join(""):"";
    return mrows+dayRows;
  }).join("");
  // 凡例(※全R=…等)はマスターの指示で撤去(2026-09-02)。3行に伸びてヘッダの他要素と
  // 重なって読めなくなっていた。各行の意味は設定タブの用語説明が担う。
  // #senCountはタブ切替時の共通クリア処理(renderTab)で空になり、:emptyで非表示。
  m.innerHTML=`<div class="accwrap"><table class="acctbl">
      <colgroup><col style="width:20%"><col style="width:12%"><col style="width:26%"><col style="width:21%"><col style="width:21%"></colgroup>
      ${headRow}${totalRows}${curMonthRows}${todayRows}${curDayRows}${pastRows}
    </table></div>`;
  m.querySelectorAll(".acctbl tr.mrow").forEach(tr=>tr.onclick=()=>{const k=tr.getAttribute("data-m");accOpenM[k]=!accOpenM[k];renderAcc(acc);});
  requestAnimationFrame(positionAccSticky);
}
function positionAccSticky(){
  if(cur!=="acc")return;
  const tbl=document.querySelector(".acctbl");
  if(!tbl)return;
  // #mainが常にスクロール祖先なのでstickyのtop起点は0。
  // 高さは小数精度(getBoundingClientRect)で累積する。整数丸め(offsetHeight)だと
  // 固定行の間にサブピクセルの隙間ができ、スクロール内容が透けて見えるため。
  let top=0;
  tbl.querySelectorAll("tr.stkrow").forEach(tr=>{
    Array.prototype.forEach.call(tr.children,cell=>{cell.style.top=top+"px";});
    top+=tr.getBoundingClientRect().height;
  });
}
// #mainの高さ = ビューポート - ヘッダー - 下部ナビ。全タブ共通(内部スクロール)。
// 注意: standaloneのビューポート(innerHeight)はステータスバー分だけ実画面より小さいが、
// 下端は実画面最下部に一致している(実測で確認済み)。screen.heightとの差を下端の隙間と
// みなしてナビを下へずらすとナビが画面外に隠れる(v128の失敗)。ずらし処理は入れないこと。
function fitMain(){
  const m=$("#main");if(!m)return;
  const hdr=document.querySelector("header"),nv=document.querySelector("nav");
  m.style.height=(window.innerHeight-(hdr?hdr.offsetHeight:0)-(nv?nv.offsetHeight:0))+"px";
}
if(!accResizeBound){accResizeBound=true;
  // 画面回転/リサイズ追随
  window.addEventListener("resize",()=>{fitMain();if(cur==="acc")positionAccSticky();});
  // ヘッダー内容は描画後に非同期で変わる(日付ナビ/当日メタ等)ため、
  // 高さ変化を監視して#mainの高さを追随させる(下部ナビとの隙間/被りを防ぐ)。
  if(window.ResizeObserver){new ResizeObserver(()=>fitMain()).observe(document.querySelector("header"));}
}

// 「的中したのに購入額を下回った」実測値の注記。accuracy.json の sen_hitloss/prm_hitloss
// (的中のうち払戻が購入額の厳選300円(旧・松は400円)に満たなかった件数)から組み立てる。締切15分前の板で
// 判定する以上ゼロにはできないので、固定文でなく実測をそのまま出す。
function _lossNote(isTake){
  const t=(VIEW.acc&&VIEW.acc.total)||null;
  if(!t)return "";
  const hit=isTake?t.sen_hit:t.prm_hit, loss=isTake?t.sen_hitloss:t.prm_hitloss;
  if(!hit||loss==null)return "";
  if(!loss)return `実測では的中${hit}件すべてがプラス。`;
  return `締切までにオッズが下がることがあり、実測では的中${hit}件のうち${loss}件(${Math.round(loss/hit*1000)/10}%)が購入額を下回った。`;
}
function renderModel(rep){
  // 設定タブ: 通知/アプリ情報を上部に、表示的中率の検証を中段に、
  // モデル詳細(学習と精度)は折りたたみで下部に置く。
  const m=$("#main");
  const tm=rep?(rep.test_metrics||{}):{}, bm=rep?(rep.baseline_metrics||{}):{};
  const fi=Object.entries((rep&&rep.feature_importance)||{}).slice(0,10)
    .map(([k,v])=>`<div class="kv"><span>${k}</span><span class="num">${Math.round(v)}</span></div>`).join("");
  // 表示的中率の検証: docs/calib.json(=VIEW.calib/CALIB)がある場合のみ、表示帯別に
  // 直近30日/全期間の実測的中率を突き合わせて確認できる小表を出す。
  let calibSec="";
  const cal=VIEW.calib;
  if(cal){
    const vf=cal.verify||{};
    const recent=vf.recent30||[];
    const full=vf.full||[];
    const bandSet=[];const seen={};
    full.concat(recent).forEach(x=>{if(x&&x.band!=null&&!seen[x.band]){seen[x.band]=true;bandSet.push(x.band);}});
    const findB=(arr,b)=>arr.find(x=>x&&x.band===b);
    const rows=bandSet.map(b=>{
      const r30=findB(recent,b),rf=findB(full,b);
      const c30=r30?pct((r30.act||0)/100)+"("+(r30.n||0)+"R)":"-";
      const cf=rf?pct((rf.act||0)/100)+"("+(rf.n||0)+"R)":"-";
      return `<tr><td>${esc(b)}</td><td class="num">${c30}</td><td class="num">${cf}</td></tr>`;
    }).join("");
    const nTotal=cal.n_races!=null?cal.n_races:(cal.races!=null?cal.races:full.reduce((a,x)=>a+((x&&x.n)||0),0));
    calibSec=`<div class="sec" style="margin-top:18px">表示的中率の検証</div>
      <div style="font-size:11px;color:var(--dim);margin:-2px 0 8px">表示している的中率が実測と一致しているかの自動検証(毎朝更新)</div>
      <div class="kv"><span>更新日</span><span class="num">${cal.updated_at||"-"}</span></div>
      <div class="kv"><span>対象レース数</span><span class="num">${nTotal.toLocaleString()}R</span></div>
      <table><tr><th>表示帯</th><th>直近30日 実測</th><th>全期間 実測</th></tr>${rows||'<tr><td colspan="3">データなし</td></tr>'}</table>`;
  }
  // 打刻バッジの較正監視: 2026-09-02以降(T-15打刻レジーム)の注目/様子見の実測を、
  // バッジの約束(注目=較正40%以上)と突き合わせる。遡及集計分(9/1以前)は混ぜない。
  // n>=100でWilson 95%CIにより判定: 上限<40%なら警告、下限>=40%なら整合、他は保留。
  {
    const bdays=((VIEW.acc||{}).days||[]).filter(d=>d.date>="20260902");
    const an=bdays.reduce((a,d)=>a+(d.att_n||0),0), ah=bdays.reduce((a,d)=>a+(d.att_hit||0),0);
    const yn=bdays.reduce((a,d)=>a+(d.yos_n||0),0), yh=bdays.reduce((a,d)=>a+(d.yos_hit||0),0);
    const wil=(h,n,sgn)=>{const z=1.96,p=h/n,dd=1+z*z/n;return (p+z*z/(2*n)+sgn*z*Math.sqrt((p*(1-p)+z*z/(4*n))/n))/dd;};
    let judge='<span style="color:var(--dim)">蓄積中(n=100から自動判定)</span>';
    if(an>=100){
      judge = wil(ah,an,1)<0.40
        ? '<span style="color:#E5484D;font-weight:700">警告: 注目の実測が40%を有意に下回っています(較正の再確認が必要)</span>'
        : (wil(ah,an,-1)>=0.40 ? '<span style="color:#1FB97A">整合(実測40%以上を統計的に確認)</span>'
                               : '<span style="color:var(--dim)">判定保留(40%と統計的に区別できない)</span>');
    }
    calibSec+=`<div class="sec" style="margin-top:18px">バッジ実測の監視(締切15分前確定分)</div>
      <div style="font-size:11px;color:var(--dim);margin:-2px 0 8px">2026-09-02以降に打刻で確定したバッジの実測。「注目=較正40%以上」が実測で保たれているかを自動判定(遡及集計分は含めない)</div>
      <div class="kv"><span>注目</span><span class="num">${an?`${ah}/${an} (${(ah/an*100).toFixed(1)}%)`:"-"}</span></div>
      <div class="kv"><span>様子見</span><span class="num">${yn?`${yh}/${yn} (${(yh/yn*100).toFixed(1)}%)`:"-"}</span></div>
      <div class="kv"><span>判定</span><span class="num">${judge}</span></div>`;
  }
  const pushSec=PUSH_WORKER?'<div id="pushSec"></div>':`<div class="sec" style="margin-top:14px">通知</div>
    <div class="kv"><span>プッシュ通知</span><span class="num" style="color:var(--dim)">準備中</span></div>
    <div style="font-size:11px;color:var(--dim);margin-top:6px">厳選プランの確定と結果を端末に通知する機能を準備しています。公開時はここでオン/オフできます。</div>`;
  const modelBody=rep?`
    <div class="kv"><span>学習日時</span><span class="num">${rep.trained_at||"-"}</span></div>
    <div class="kv"><span>学習期間</span><span class="num">${(rep.period||[]).join(" - ")}</span></div>
    <div class="kv"><span>学習行数</span><span class="num">${(rep.rows_train||0).toLocaleString()}</span></div>
    <div class="kv"><span>プラン条件</span><span class="num">厳選プラン: 5R以降・TOP3合計確率36%以上・全3点オッズ3.1倍以上・安定水面のみ<br>7,339レースのバックテストで決定<br>オッズは締切15分前時点の値で判定(締切までに変動します)</span></div>
    <div class="sec" style="margin-top:18px">テスト精度(直近期間・未学習データ)</div>
    <div style="font-size:11px;color:var(--dim);margin:-2px 0 8px">学習時に測ったモデル単体の精度。すべてTOP5基準で、厳選プランの成績とは別物です。プランの実績は的中実績タブをご覧ください。</div>
    <div class="kv"><span>1着的中率</span><span class="num">${pct(tm.win_hit_rate||0)} (基準 ${pct(bm.win_hit_rate||0)})</span></div>
    <div class="kv"><span>3連単 予測</span><span class="num">${pct(tm.top1_hit_rate||0)} (基準 ${pct(bm.top1_hit_rate||0)})</span></div>
    <div class="kv"><span>3連単 TOP5内</span><span class="num">${pct(tm.top5_hit_rate||0)} (基準 ${pct(bm.top5_hit_rate||0)})</span></div>
    <div class="kv"><span>3連単 TOP10内</span><span class="num">${pct(tm.top10_hit_rate||0)} (基準 ${pct(bm.top10_hit_rate||0)})</span></div>
    <div class="kv"><span>高確率帯 TOP5内${tm.sengen&&tm.sengen.top5_min!=null?"(合計"+Math.round(tm.sengen.top5_min*100)+"%以上)":""}</span><span class="num">${tm.sengen&&tm.sengen.top5_hit_rate!=null?pct(tm.sengen.top5_hit_rate)+" ("+tm.sengen.races_per_day+"R/日)":"-"}</span></div>
    <div class="kv"><span>回収率(TOP5均等買い)</span><span class="num">${pct(tm.top5_roi||0)}</span></div>
    <div class="sec" style="margin-top:18px">特徴量重要度 TOP10</div>${fi}`
    :'<div class="note">モデル情報がありません。<br>学習完了後に表示されます。</div>';
  const terms=[
    ["判断(注目/様子見)","全レースに付く参考判断。過去実測に較正した的中率(TOP5)が40%以上なら「注目」、未満なら「様子見」。締切15分前に確定し以後変わらない。バッジ別の実績は的中実績タブに掲載。2026-09-02以降は締切15分前に確定したバッジの実績、それ以前は保存済みの買い目に導入時点の較正表を一括適用した遡及集計(1回だけ計算し、以後再計算しない)。"],
    ["的中率の%バッジ","AIの自己申告ではなく、過去全レースの実測的中率に補正(較正)した数値。金色は50%以上。下の「表示的中率の検証」で実測との一致を毎朝確認している。"],
    ["候補","厳選プランの確率条件を満たし、締切15分前の最終判定(オッズ条件)を待っているレース。数値はまだ確定していない。「確定予定」に判定が行われる時刻を表示する。"],
    ["確定","締切15分前の時点でプラン対象に確定したレース。確定した内容と時刻はデータに記録され、以後の後出し変更はできない。"],
    ["見送り","候補だったが最終判定でオッズ条件を満たさなかったレース。見送った理由を明記する。"],
    ["厳選プラン","厳選3点買い(100円×3点)。締切15分前のオッズで3点すべて3.1倍以上のレースだけを選ぶ。5R以降のみ。"+_lossNote(true)],
    ["矢印つきの倍率(4.5→2.9倍)","左が判定した時点(締切15分前)のオッズ、右が実際の払戻。判定は左の値で行っている。締切間際に人気が集まるとオッズは下がるため、この2つは一致しないことがある。"],
    ["判定/結果/払戻金","レース確定後の答え合わせ。予測TOP5内に的中したか・1〜3着の並び・3連単100円あたりの払戻額。"],
  ].map(t=>`<div class="term"><b>${t[0]}</b><span>${t[1]}</span></div>`).join("");
  let startTab="today";try{if(localStorage.getItem("aritei_start_tab")==="sen")startTab="sen";}catch(_){/*プライベートモード等*/}
  m.innerHTML=`<div class="pad">
    ${pushSec}
    <div class="sec" style="margin-top:18px">表示</div>
    <div class="kv"><span>起動時に開くタブ</span><span style="display:flex;gap:6px"><button class="chip stb${startTab==="today"?" on":""}" data-t="today" style="font-size:12px;padding:5px 12px">当日予測</button><button class="chip stb${startTab==="sen"?" on":""}" data-t="sen" style="font-size:12px;padding:5px 12px">厳選一覧</button></span></div>
    <div class="sec" style="margin-top:18px">アプリ</div>
    <div class="kv"><span>バージョン</span><span class="num" id="appVer">-</span></div>
    <div class="kv"><span>画面情報(診断用)</span><span class="num" id="scrInfo" style="font-size:10px">-</span></div>
    <div style="margin-top:10px"><button id="appReload" class="chip">最新版に更新(再読み込み)</button></div>
    ${calibSec}
    <details class="setdet"><summary>用語とバッジの説明</summary>${terms}</details>
    <details class="setdet"><summary>モデル情報(学習と精度)</summary>${modelBody}</details>
  </div>`;
  if(PUSH_WORKER)renderPushSection();
  _renderAppVer();
  {const rb=document.getElementById("appReload");if(rb)rb.onclick=_appReload;}
  m.querySelectorAll(".stb").forEach(b=>b.onclick=()=>{
    try{localStorage.setItem("aritei_start_tab",b.dataset.t);}catch(_){/*保存不可でも表示だけ切替*/}
    m.querySelectorAll(".stb").forEach(x=>x.classList.toggle("on",x===b));
  });
  {const si=document.getElementById("scrInfo");if(si)si.textContent=_screenInfo();}
}

// 画面診断: ビューポート/実画面/セーフエリア/ナビ下端の実測値。standalone表示ずれの遠隔調査用。
function _screenInfo(){
  try{
    const p=document.createElement("div");
    p.style.cssText="position:fixed;bottom:0;padding-bottom:env(safe-area-inset-bottom);visibility:hidden";
    document.body.appendChild(p);
    const inset=Math.round(parseFloat(getComputedStyle(p).paddingBottom)||0);
    p.remove();
    const nv=document.querySelector("nav");
    const nb=nv?Math.round(nv.getBoundingClientRect().bottom):0;
    const sa=_isStandalone()?" 全画面":"";
    return `${window.innerWidth}x${window.innerHeight} 画面${screen.width}x${screen.height} inset${inset} ナビ下端${nb}${sa}`;
  }catch(_){return "-";}
}

// バージョン表示(sw.jsのCACHE_VERSIONを唯一の出所として取得): ロゴ横(#hdrVer)と
// 設定タブ(#appVer)を埋める。表示は「vメジャー.マイナー」形式。
// メジャー=商品体系の世代(git履歴の節目で定義。新世代はこの表に追記する):
//   1=初版・複勝90%型の厳選(2026-06-11, 通し番号v1〜)
//   2=3連単TOP3方式+松竹梅3ティア(2026-08-02, v78〜)
//   3=アリテイ改名+締切15分前確定方式(2026-08-04, v108〜)
//   4=松終売・全レース/厳選の2ティア+バッジ実績(2026-09-01, v144〜)
// マイナー=世代開始からのデプロイ数(sw.js通し番号の差。デプロイごとに自動で+1)。
const GEN_STARTS=[[4,144],[3,108],[2,78],[1,1]];
async function _renderAppVer(){
  const hv=document.getElementById("hdrVer"), el=document.getElementById("appVer");
  try{
    const t=await (await fetch("sw.js",{cache:"no-store"})).text();
    const mv=t.match(/kyotei-ai-v(\d+)/);
    if(!mv){if(el)el.textContent="-";return;}
    const n=+mv[1];
    const g=GEN_STARTS.find(x=>n>=x[1])||[1,1];
    const v=`v${g[0]}.${n-g[1]}`;
    if(hv)hv.textContent=v;
    if(el)el.textContent=`${v}(通算${n}版)`;
  }catch(_){if(el)el.textContent="-";}
}
async function _appReload(){
  const b=document.getElementById("appReload");if(b){b.disabled=true;b.textContent="更新中…";}
  try{if("serviceWorker" in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.update()));}}catch(_){}
  location.reload();
}

// プッシュ通知セクション(設定タブ)。PUSH_WORKERが空の間は呼ばれない(=「準備中」の静的表示のみ)。
function _isIOSDevice(){return /iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);}
function _isStandalone(){return !!window.navigator.standalone||(window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches);}
async function renderPushSection(){
  const el=document.getElementById("pushSec");
  if(!el)return;
  if(_isIOSDevice()&&!_isStandalone()){
    el.innerHTML=`<div class="sec" style="margin-top:18px">プッシュ通知</div>
      <div style="font-size:12px;color:var(--dim);line-height:1.7">ホーム画面に追加したアプリから設定できます(共有ボタン→ホーム画面に追加)</div>`;
    return;
  }
  if(!("serviceWorker" in navigator)||!("PushManager" in window)){
    el.innerHTML=`<div class="sec" style="margin-top:18px">プッシュ通知</div>
      <div style="font-size:12px;color:var(--dim);line-height:1.7">この端末はプッシュ通知に対応していません。</div>`;
    return;
  }
  el.innerHTML=`<div class="sec" style="margin-top:18px">プッシュ通知</div><div id="pushBody" style="font-size:12px;color:var(--dim)">確認中…</div>`;
  try{
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.getSubscription();
    _pushBodyRender(sub);
  }catch(e){
    const b=document.getElementById("pushBody");if(b)b.textContent="通知状態の確認に失敗しました。";
  }
}
function _pushBodyRender(sub){
  const b=document.getElementById("pushBody");
  if(!b)return;
  if(sub){
    b.innerHTML=`<div style="color:var(--text);margin-bottom:8px">通知は有効です</div><button id="pushOff" class="chip">解除</button>`;
    const off=document.getElementById("pushOff");if(off)off.onclick=()=>_pushUnsubscribe(sub);
  }else{
    b.innerHTML=`<button id="pushOn" class="chip">通知を受け取る</button>`;
    const on=document.getElementById("pushOn");if(on)on.onclick=_pushSubscribe;
  }
}
async function _pushSubscribe(){
  const b=document.getElementById("pushBody");
  try{
    const perm=await Notification.requestPermission();
    if(perm!=="granted"){if(b)b.innerHTML='<div style="color:var(--dim)">通知が許可されませんでした。</div>';return;}
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(VAPID_PUB)});
    const res=await fetch(PUSH_WORKER+"/sub",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({subscription:sub})});
    if(!res.ok)throw new Error("subscribe register failed "+res.status);
    _pushBodyRender(sub);
  }catch(e){
    if(b)b.innerHTML='<div style="color:var(--dim)">通知の登録に失敗しました。</div>';
  }
}
async function _pushUnsubscribe(sub){
  const b=document.getElementById("pushBody");
  try{
    await fetch(PUSH_WORKER+"/unsub",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({endpoint:sub.endpoint})});
    await sub.unsubscribe();
    _pushBodyRender(null);
  }catch(e){
    if(b)b.innerHTML='<div style="color:var(--dim)">解除に失敗しました。</div>';
  }
}

async function show(tab){
  const token=++showGen;
  cur=tab;
  const m=$("#main");
  // 全タブ共通で#mainの内部スクロール(ページ全体は常時ロック)。下部ナビとヘッダーの
  // 位置はタブに依らず固定される(SafariのURLバー伸縮の影響を受けない)。
  {const hc=document.getElementById("hdrChips");if(hc)hc.innerHTML="";const sc=document.getElementById("senCount");if(sc)sc.textContent="";const dn=document.getElementById("dateNav");if(dn)dn.innerHTML="";const _tm=document.getElementById("todayMeta");if(_tm)_tm.innerHTML="";}
  const map={sen:"Sen",today:"Today",acc:"Acc",model:"Model"};
  ["Sen","Today","Acc","Model"].forEach(t=>$("#tab"+t).classList.toggle("on",map[tab]===t));
  // 高さ計測はタブクラス適用後に行う(ヘッダの高さがタブ依存CSSで変わるため。resize時の再計算と同条件)
  fitMain();
  m.innerHTML='<div class="spin"></div>';
  try{
    if(tab==="sen"){
      if(!pred) pred=await fetchJSON("predictions/latest.json");sortVenues(pred);
      if(token!==showGen) return;
      renderSengen();
    }else if(tab==="today"){
      viewPred=null;
      if(!pred) pred=await fetchJSON("predictions/latest.json");sortVenues(pred);
      if(token!==showGen) return;
      if(pred){latestDate=pred.date;if(!PREDS[pred.date])PREDS[pred.date]=pred;if(dateList&&dateList.indexOf(pred.date)<0){dateList.push(pred.date);dateList.sort();}}
      renderToday();
      ensureDateList().then(()=>{if(token===showGen&&cur==="today"){renderDateNav(viewPred||pred);}});
    }else if(tab==="acc"){
      if(!VIEW.acc) VIEW.acc=await fetchJSON("accuracy.json").catch(()=>null);
      if(token!==showGen) return;
      renderAcc(VIEW.acc);
    }else{
      if(!VIEW.model) VIEW.model=await fetchJSON("model_report.json").catch(()=>null);
      // 用語説明に「的中したのに損になった割合」の実測値を出すため実績も読む
      if(!VIEW.acc) VIEW.acc=await fetchJSON("accuracy.json").catch(()=>null);
      if(token!==showGen) return;
      renderModel(VIEW.model);
    }
  }catch(e){
    if(token!==showGen) return;
    m.innerHTML=`<div class="note">データの取得に失敗しました。<br>${e.message}</div>`;
  }
  // 描画完了後に先頭表示へ(前のタブのスクロール位置を引き継がない)。
  // 当日予測はrenderToday側で現在時刻帯へ自動ポジションするため対象外。
  if(tab!=="today"&&token===showGen)m.scrollTop=0;
}
$("#tabSen").onclick=()=>show("sen");
$("#tabToday").onclick=()=>show("today");
$("#tabAcc").onclick=()=>show("acc");
$("#tabModel").onclick=()=>show("model");
if("scrollRestoration" in history)history.scrollRestoration="manual";
// 起動タブ: 設定「起動時に開くタブ」の保存値を反映(未設定/取得不可は当日予測)
{let _st="today";try{if(localStorage.getItem("aritei_start_tab")==="sen")_st="sen";}catch(_){/*プライベートモード等*/}show(_st);}
// 較正表(calib.json)は起動時に1回取得。失敗時はCALIB=nullのまま内蔵フォールバック表を使う。
// 取得完了が現在表示中のタブの描画より後になった場合は、そのタブだけ再描画して反映する。
fetchJSON("calib.json").then(c=>{
  CALIB=c;VIEW.calib=c;
  if(cur==="today")renderToday();
  else if(cur==="sen")renderSengen();
  else if(cur==="model")renderModel(VIEW.model);
}).catch(()=>{});
if("serviceWorker" in navigator){
  // 既にSWが制御していた=更新の場合のみ、新SW有効化時に1回だけリロード。
  // 初回訪問(controller無し)のclaimでは発火してもリロードしない(不要な二重読込を防止)。
  var _hadCtrl=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js");
  _renderAppVer(); // ロゴ横のバージョンは起動時から表示(設定タブを開かなくても埋まる)
  let _swReloading=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(!_hadCtrl||_swReloading) return; _swReloading=true; location.reload();
  });
}

let refreshBusy=false;
async function refreshLatest(){
  if(refreshBusy) return;
  refreshBusy=true;
  try{
    const fresh=await fetchJSON("predictions/latest.json");
    sortVenues(fresh);
    const changed=!pred||["generated_at","results_updated_at","odds_updated_at","live_updated_at"].some(k=>pred[k]!==fresh[k]);
    if(changed){
      const wasCurrentDate=!pred||!viewPred||viewPred.date===pred.date;
      pred=fresh;
      latestDate=pred.date;
      PREDS[pred.date]=pred;
      if(dateList&&dateList.indexOf(pred.date)<0){dateList.push(pred.date);dateList.sort();}
      if(wasCurrentDate) viewPred=null;
      // 自動更新の再描画で展開カード/スクロール位置を壊さない: 退避→再描画→復元
      // 全タブ#mainの内部スクロールなのでscrollTopを退避/復元する
      const sc={get:()=>$("#main").scrollTop,set:v=>{$("#main").scrollTop=v;}};
      const _sy=sc.get();
      const _open=[].slice.call(document.querySelectorAll(".racelist .race.open")).map(e=>e.getAttribute("data-r")).filter(Boolean);
      autoRefreshing=true;
      if(cur==="sen") renderSengen();
      else if(cur==="today"&&wasCurrentDate) renderToday();
      autoRefreshing=false;
      if(cur==="today"){_open.forEach(rn=>{const el=document.querySelector('.racelist .race[data-r="'+rn+'"]');if(el)el.classList.add("open");});}
      sc.set(_sy);
    }
    // 的中実績(accuracy.json)も更新し、実績タブを自動反映(リロード不要)
    try{
      const fa=await fetchJSON("accuracy.json");
      if(!VIEW.acc||JSON.stringify(VIEW.acc.total||null)!==JSON.stringify(fa.total||null)){
        VIEW.acc=fa;
        if(cur==="acc") renderAcc(VIEW.acc);
      }
    }catch(_){}
  }catch(_){
    /* オフライン等は無視し、次回タイミングで再試行 */
  }finally{
    autoRefreshing=false;
    refreshBusy=false;
  }
}
// アプリ復帰(バックグラウンド→前面)時: 当日予測以外のタブは先頭表示に戻してから更新する
// (全タブ#main内部スクロールでウィンドウスクロール自体が発生しないため復元処理は不要)。
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){
  if(cur&&cur!=="today")$("#main").scrollTop=0;
  refreshLatest();
}});
setInterval(()=>{if(document.visibilityState==="visible")refreshLatest();},75000);
</script>
