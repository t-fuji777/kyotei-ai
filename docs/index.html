<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1B2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>艇AI - 競艇予測</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0B1B2B; --surface:#122638; --surface2:#1A3349; --line:#23425C;
  --text:#E8EEF4; --dim:#8FA6BA; --accent:#2FA8FF;
  --confA:#F5B82E; --confB:#5BC0DE; --confC:#5B6B7A;
  --b1:#F2F4F6; --b2:#15181C; --b3:#E5333C; --b4:#1F6FEB; --b5:#F5C518; --b6:#19A974;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:15px;line-height:1.5}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
#app{max-width:480px;margin:0 auto;min-height:100vh;
  padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:#0B1B2B;
  backdrop-filter:blur(8px);
  padding:calc(10px + env(safe-area-inset-top)) 16px 4px}
header h1{font-size:18px;font-weight:800;letter-spacing:.04em}
header h1 span{color:var(--accent)}
#hdrDate{color:var(--dim);font-size:12px;margin-top:2px}
#hdrMeta{color:var(--dim);font-size:11px;margin-top:1.6px;display:block;position:relative}
#hdrMetaTxt{white-space:pre-line}
#dateNav{margin-left:auto;display:flex;align-items:center;gap:3px;position:relative}
#dateNav .dnav{background:var(--surface);border:1px solid var(--line);color:var(--text);width:25px;height:25px;border-radius:8px;font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0 0 4px 0}
#dateNav .dnav:disabled{opacity:.35;cursor:default}
#dateNav .dsel{display:flex;align-items:center;justify-content:flex-start;gap:2px;width:120px;height:25px;position:relative;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:0 5px 0 8px;font-size:11px;font-weight:700;line-height:1;cursor:pointer;white-space:nowrap}
#dateNav .dsel .car{color:var(--dim);font-size:20px;position:absolute;right:6px;top:50%;transform:translateY(-50%)}
#dMenu{position:absolute;top:calc(100% + 6px);left:28px;z-index:30;width:120px;max-height:50vh;overflow-y:auto;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.45);-webkit-overflow-scrolling:touch}
#dMenu[hidden]{display:none}
#dMenu .dopt{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:none;color:var(--text);padding:9px 12px 9px 4px;font-size:11px;border-radius:6px;cursor:pointer;white-space:nowrap}
#dMenu .dopt:hover{background:var(--surface)}
#dMenu .dopt.on{background:var(--accent);color:#06121E;font-weight:700}
#dMenu .dtoday{font-size:10px;color:var(--dim)}
#dMenu .dopt.on .dtoday{color:#06121E}

nav{position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:rgba(11,27,43,.95);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:none;color:var(--dim);
  padding:10px 0 8px;font-size:11px;font-weight:600;cursor:pointer}
nav button.on{color:var(--accent)}
nav button svg{display:block;margin:0 auto 3px;width:20px;height:20px;
  stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.hdrtop{display:flex;align-items:center;gap:10px}.hdrtop h1{flex:0 0 auto;margin:0}#hdrChips{position:absolute;top:0;right:0;display:flex;justify-content:flex-end}#hdrChips:empty{display:none}#venSel{display:flex;justify-content:space-between;width:148px;height:25px;margin-top:8px;align-self:center;align-items:center;gap:2px;max-width:100%;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:2px 5px 2px 12px;font-size:14px;font-weight:700;line-height:1.2;cursor:pointer;white-space:nowrap}#venSel .car{color:var(--dim);font-size:20px}#venMenu{position:absolute;top:calc(100% + 6px);right:0;z-index:30;width:152px;max-height:50vh;overflow-y:auto;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.45);-webkit-overflow-scrolling:touch}#venMenu[hidden]{display:none}.venopt{display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);padding:9px 12px;font-size:14px;border-radius:6px;cursor:pointer;white-space:nowrap}.venopt:hover{background:var(--surface)}.venopt.on{background:var(--accent);color:#06121E;font-weight:700}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);
  color:var(--text);border-radius:999px;padding:7px 14px;font-size:13px;
  font-weight:600;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#06121E}

.racelist{padding:0 16px}.racelist>.race:first-child{margin-top:7px}
.race{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  margin-bottom:7px;overflow:hidden}
.racehead{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer}.racelist.sengen .racehead{cursor:default}
.rno{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;font-size:16px;font-weight:800;min-width:34px}
.rven{font-size:10px;font-weight:600;color:var(--dim);line-height:1.1;margin-top:2px;letter-spacing:.02em}
.rno.jump{cursor:pointer;border-radius:8px;padding:2px 6px;margin:-2px -6px;transition:background .15s}
.rno.jump:active{background:rgba(91,192,222,.26)}
@keyframes flashbg{0%{background:rgba(91,192,222,.30)}100%{background:transparent}}
.race.flash{animation:flashbg 1.5s ease}
.rmeta{flex:1;min-width:0}
.rtype{font-size:12px;color:var(--dim);display:inline-block;max-width:100%;white-space:nowrap;overflow:hidden;vertical-align:bottom}
.rdl{font-size:11px;color:var(--dim)}
.honmei{display:flex;gap:3px;align-items:center}
.conf{font-size:11px;font-weight:800;border-radius:6px;padding:3px 7px;min-width:24px;text-align:center}
.confA{background:var(--confA);color:#1A1200}
.confB{background:var(--confB);color:#04222C}
.senp{font-size:12px;font-weight:800;border-radius:6px;padding:3px 8px;background:#1FB97A;color:#04150C}
.superbadge{font-size:9px;font-weight:800;border-radius:5px;padding:2px 5px;background:var(--confA);color:#1A1200;line-height:1.4;white-space:nowrap;margin-left:4px}
.livechip{font-size:9px;font-weight:800;border-radius:5px;padding:2px 5px;background:#7C4DFF;color:#fff;line-height:1.4;white-space:nowrap}.voidchip{font-size:9px;font-weight:800;border-radius:5px;padding:2px 5px;background:#E53935;color:#fff;line-height:1.4;white-space:nowrap}
.exv{min-width:34px;text-align:right;font-size:11px;color:var(--dim)}
.oddv{font-size:11px;color:#FFC53D;margin-left:6px;display:inline-block;min-width:42px;text-align:right}
.hitchip{font-size:10px;font-weight:800;border-radius:5px;padding:2px 6px;background:#1FB97A;color:#04150C;margin-left:4px}
.misschip{font-size:10px;font-weight:800;border-radius:5px;padding:2px 6px;background:#E5484D;color:#fff;margin-left:4px}
.resv{font-size:12px;font-weight:600;color:#7dd3fc;background:rgba(56,189,248,.12);padding:1px 7px;border-radius:5px}
.vlabel{font-size:11px;color:var(--mut,#8FA3B8);display:block}
.confC{background:var(--confC);color:#0B1B2B}
.lane{display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:5px;font-size:13px;font-weight:800;
  font-variant-numeric:tabular-nums}
.lane.s{width:18px;height:18px;font-size:11px;border-radius:4px}
.l1{background:var(--b1);color:#10141A}
.l2{background:var(--b2);color:#F2F4F6;box-shadow:inset 0 0 0 1px #3A4654}
.l3{background:var(--b3);color:#fff}
.l4{background:var(--b4);color:#fff}
.l5{background:var(--b5);color:#231A00}
.l6{background:var(--b6);color:#04231A}
.racebody{display:none;border-top:1px solid var(--line);padding:8px 14px 12px}
.race.open .racebody{display:block}
.resbox{background:rgba(56,189,248,.07);border:1px solid rgba(56,189,248,.35);border-radius:10px;padding:10px 12px;margin:0 0 12px}
.resttl{font-size:11px;font-weight:700;letter-spacing:.08em;color:#7dd3fc;margin-bottom:6px}
.resrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.reschips{display:inline-flex;gap:3px}
.reskime{font-size:13px;color:#cbd5e1}
.respay{font-size:13px;color:#e2e8f0;margin-left:auto}
.respay b{color:#fde047;font-size:15px}
.rgrid{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.rcol{display:flex;flex-direction:column;gap:4px;align-items:center}
.rhd{font-size:9px;letter-spacing:.08em;color:var(--dim)}
.rcombo{display:inline-flex;gap:3px}
.rjudge{font-size:22px;font-weight:800;line-height:1}
.jhit{color:#34D399}
.jmiss{color:#F87171}
.jbest{color:#FBBF24}
.rsub{margin-top:9px;font-size:11px;color:#94a3b8;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rtag{background:rgba(52,211,153,.15);color:#34D399;border:1px solid rgba(52,211,153,.4);border-radius:6px;padding:1px 6px;font-size:10px}
.rwait{color:var(--dim);opacity:.55}
.hjp{display:flex;gap:9px;align-items:flex-start;flex-shrink:0}
.hjc{display:flex;flex-direction:column;align-items:center;gap:6px}
.hjl{font-size:8px;letter-spacing:.04em;color:var(--dim);line-height:1}
.hjv{display:inline-flex;gap:3px;align-items:center;min-height:18px;font-size:12px}.hjp>.hjc:nth-child(-n+3)>.hjv{margin-top:4px}
.hjw{min-width:60px;justify-content:center}
.lph{background:rgba(140,160,180,.08);box-shadow:inset 0 0 0 1px rgba(140,160,180,.22)}
.rj2{font-size:15px;font-weight:800;line-height:1}
.resbadges{display:flex;gap:6px;flex-wrap:wrap}
.rbadge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px}
.rb-hit{background:#16a34a;color:#fff}
.rb-miss{background:rgba(148,163,184,.18);color:#94a3b8}

.sec{font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.08em;margin:8px 0 6px}.racebody>.sec:first-child{margin-top:0}
.boatrow{display:grid;grid-template-columns:auto minmax(0,1fr) 32px 46px 48px 32px 40px;align-items:center;column-gap:6px;padding:4px 0}
.bname{min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bcls{justify-self:start;font-size:11px;color:var(--dim)}.bbar{height:7px;background:var(--surface2);border-radius:4px;overflow:hidden}.bbar i{display:block;height:100%;background:var(--accent);border-radius:4px}.bst{justify-self:end;text-align:right;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}.bex{justify-self:end;text-align:right;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}.sechead{padding:0;margin:8px 0 6px}.sectitle{grid-column:1/6;font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.08em}.bh{justify-self:end;text-align:right;font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.08em}.fstart{color:#FF5252}.wxinfo{font-size:11px;color:var(--dim);margin:-2px 0 7px;letter-spacing:.01em}.warr{display:inline-block;font-style:normal;color:var(--text)}
.bar{flex:0 0 96px;height:7px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bp{min-width:42px;text-align:right;font-size:12px;font-weight:700}
.pickrow{display:flex;align-items:center;gap:8px;padding:3px 0}
.prank{min-width:18px;color:var(--dim);font-size:11px;text-align:right}
.pickrow .bar{flex:1}
.pickrow .bar i{background:#3D7FB8}
.pickrow:first-of-type .bar i{background:var(--accent)}

.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.card .v{font-size:22px;font-weight:800}
.card .k{font-size:11px;color:var(--dim);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:600;font-size:11px}
th:first-child,td:first-child{text-align:left}.acctbl th,.acctbl td{text-align:center;vertical-align:middle}
.pad{padding:0 16px}
.note{color:var(--dim);font-size:13px;padding:32px 24px;text-align:center;line-height:1.8}.race.gap{opacity:.55}.gapnote{margin-left:auto;color:var(--dim);font-size:12px}.venopt.off{opacity:.4;color:var(--dim);cursor:default;pointer-events:none}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv span:first-child{color:var(--dim)}
.warn{margin:10px 16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  color:var(--dim);font-size:11px;line-height:1.7}
#senCount{position:absolute;right:16px;bottom:5px;margin:0;font-size:13px;line-height:1.42;font-weight:700;display:grid;grid-template-columns:auto auto;column-gap:4px;justify-items:end;color:var(--dim)}#senCount .ssl{color:var(--dim);font-weight:300}.ssk{display:inline-block;width:3.25em;text-align:justify;text-align-last:justify}#senCount .ssv{color:var(--confA);font-weight:500;font-variant-numeric:tabular-nums}#senCount:empty{display:none}#todayMeta{position:absolute;right:0;top:0;margin:0;font-size:11px;line-height:16.5px;font-weight:400;display:grid;grid-template-columns:auto auto auto;column-gap:0;align-items:baseline;color:var(--dim)}#todayMeta .tml{justify-self:end;color:var(--dim);font-weight:400}#todayMeta .tmv{justify-self:end;color:var(--confA);font-weight:400;font-variant-numeric:tabular-nums;white-space:nowrap}#todayMeta .tmn{justify-self:start;color:var(--dim);font-weight:400;white-space:nowrap}#todayMeta:empty{display:none}
.spin{width:28px;height:28px;border:3px solid var(--surface2);border-top-color:var(--accent);
  border-radius:50%;margin:48px auto;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
.todaytog{position:sticky;top:calc(var(--hh,84px) - 1px);z-index:15;display:flex;gap:0;padding:0 16px;margin:0;background:var(--bg)}.todaytog::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:1px;background:var(--line)}
body:has(#tabSen.on) header{border-bottom:1px solid var(--line)}body:has(#tabToday.on) header{padding-bottom:0px}.todaytog .tt{flex:1;background:none;border:none;border-bottom:2px solid transparent;color:var(--dim);border-radius:0;padding:10.5px 0 4.2px;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:-1px}.todaytog .tt.on{color:var(--accent);border-bottom-color:var(--accent)}.timesec{font-size:11px;color:var(--dim);font-weight:700;letter-spacing:.04em;margin:16px 2px 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}.timesec:first-child{margin-top:4px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hdrtop"><h1>艇<span>AI</span> 競艇予測</h1><span id="dateNav"></span><span id="senCount" class="num"></span></div>
    <div id="hdrDate" class="num" hidden></div>
    <div id="hdrMeta" class="num"><span id="hdrMetaTxt"></span><div id="hdrChips"></div><span id="todayMeta" class="num"></span></div>
  </header>
  <main id="main"><div class="spin"></div></main>
</div>
<nav>
  <button id="tabSen">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg>
    厳選</button>
  <button id="tabToday" class="on">
    <svg viewBox="0 0 24 24"><path d="M3 14c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/><path d="M3 19c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/><path d="M6 11l5-7 7 5-2 3"/></svg>
    本日予測</button>
  <button id="tabAcc">
    <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>
    的中実績</button>
  <button id="tabModel">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
    モデル</button>
</nav>
<script>
const $=s=>document.querySelector(s);
// 厳選: モデル信頼度が高く水面が安定した会場の3連単。2段構成(通常/超厳選)。閾値/除外会場は過去実績のtrain/test検証で決定(scripts/common.py とミラー)。
const SENGEN_TOP5P_MIN=0.48, SENGEN_SUPER_MIN=0.58, SENGEN_EXCLUDE=[3,4,14];
const VIEW={today:null,acc:null,model:null};
let cur="today", pred=null, selVenue=null, todayMode="time";
let viewPred=null, dateList=null, latestDate=null, dateNavBusy=false, dnavDocBound=false;
let showGen=0;
const PREDS={};
const _WD=["日","月","火","水","木","金","土"];

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const laneChip=(n,s)=>`<span class="lane ${s?'s':''} l${n}">${n}</span>`;
const comboChips=(c,s)=>c.split("-").map(n=>laneChip(n,s)).join("");
const pct=p=>(p*100).toFixed(1)+"%";
const wfmt=v=>v==null?"-":(Math.round(v*10)/10).toFixed(1);
const windArrow=n=>(n==null||n>16)?"":` <span class="warr" style="transform:rotate(${(n-1)*22.5}deg)">↑</span>`;
const confCls=p=>p>=0.9?"confA":p>=0.8?"confB":"confC";
const top5p=r=>r.picks?r.picks.slice(0,5).reduce((a,p)=>a+(p.p||0),0):0;
const cumCls=p=>p>=0.4?"confA":p>=0.35?"confB":"confC";
const t5hit=r=>!!(r.result&&r.picks&&r.picks.slice(0,5).some(p=>p.c===r.result.order));

function dayLabel(v){if(!v)return "";if(v.is_final)return " \u00b7 \u6700\u7d42\u65e5";if(v.day_n===1)return " \u00b7 \u521d\u65e5";if(v.day_n>1)return " \u00b7 "+v.day_n+"\u65e5\u76ee";return "";}
function sortVenues(p){if(p&&Array.isArray(p.venues))p.venues.sort((a,b)=>(a.code||0)-(b.code||0));return p;}
async function fetchJSON(url){
  const r=await fetch(url+"?t="+Date.now());
  if(!r.ok) throw new Error(url+" "+r.status);
  return r.json();
}

function setHeader(p){
  p=p||pred;
  if(!p) return;
  const d=p.date;
  $("#hdrDate").textContent=`${d.slice(0,4)}/${d.slice(4,6)}/${d.slice(6,8)} の予測`;
  const mt=$("#hdrMetaTxt");if(mt)mt.textContent=`予測生成：${p.generated_at||"-"}\n学　　習：${p.model_trained_at||"-"}`;
  const _h=document.querySelector("header");if(_h)document.documentElement.style.setProperty("--hh",_h.offsetHeight+"px");
}

function axisTable(r){ return ""; }
function sengenOk(r,vcode){return top5p(r)>=SENGEN_TOP5P_MIN && SENGEN_EXCLUDE.indexOf(vcode)<0;}
function superOk(r,vcode){return top5p(r)>=SENGEN_SUPER_MIN && SENGEN_EXCLUDE.indexOf(vcode)<0;}
function fitRtype(){document.querySelectorAll(".rtype").forEach(el=>{el.style.fontSize="";let fs=12,g=0;while(el.scrollWidth>el.clientWidth+0.5&&fs>8&&g<24){fs-=0.5;el.style.fontSize=fs+"px";g++;}});}
function renderSengen(){
  const m=$("#main");
  if(!pred){m.innerHTML='<div class="spin"></div>';return}
  setHeader();
  const cfg=pred.sengen_cfg||{};
  const list=[];
  (pred.venues||[]).forEach(v=>v.races.forEach(r=>{if(sengenOk(r,v.code))list.push({v,r})}));

  const dup=pred&&days.some(d=>String(d.date)===String(pred.date));
  const tj=(td&&!dup)?{races:td.n,top1_hit:td.top1_hit,top5_hit:td.top5_hit,sen_n:td.sen_n,sen_hit:td.sen_hit,stake5:td.stake5,return5:td.return5,super_n:td.super_n,super_hit:td.super_hit}:null;
  let tt=t0;
  if(t0&&tj)tt={races:(t0.races||0)+tj.races,top1_hit:(t0.top1_hit||0)+tj.top1_hit,top5_hit:(t0.top5_hit||0)+tj.top5_hit,sen_n:(t0.sen_n||0)+tj.sen_n,sen_hit:(t0.sen_hit||0)+tj.sen_hit,stake5:(t0.stake5||0)+tj.stake5,return5:(t0.return5||0)+tj.return5,super_n:(t0.super_n||0)+(tj.super_n||0),super_hit:(t0.super_hit||0)+(tj.super_hit||0)};
  else if(!t0)tt=tj;
  if(!tt||!tt.races){m.innerHTML='<div class="note">的中実績はまだありません。<br>運用開始の翌日から自動記録されます。</div>';return;}
  const dayRows=days.slice().reverse().slice(0,60).map(d=>accRow('<span style="color:var(--dim);font-size:8px;white-space:nowrap">'+d.date.slice(2,4)+'年('+['日','月','火','水','木','金','土'][new Date(+d.date.slice(0,4),+d.date.slice(4,6)-1,+d.date.slice(6,8)).getDay()]+')</span><br>'+d.date.slice(4,6)+"/"+d.date.slice(6,8),d)).join("");
  const todayRow=tj?accRow('本日<br><span style="color:var(--dim);font-size:9px">速報</span>',tj):"";
  const totalRow=days.length?accRow('累計',tt,'font-weight:700'):"";
  const tierLine=(label,h,n)=>{
    if(!n)return `<div class="kv"><span>${label}</span><span class="num">実績なし</span></div>`;
    const rate=(h/n*100).toFixed(1)+"%";
    const prov=n<50?'<span style="color:var(--dim);font-size:11px">（暫定・母数蓄積中）</span>':"";
    return `<div class="kv"><span>${label}</span><span class="num">${rate}　実績 ${h}/${n}${prov}</span></div>`;
  };
  const summary=`<div class="pad" style="padding-bottom:0">
      <div class="sec">厳選 的中実績サマリー(累計)</div>
      ${tierLine('通常厳選',tt.sen_hit||0,tt.sen_n||0)}
      ${tierLine('超厳選',tt.super_hit||0,tt.super_n||0)}
    </div>`;
  m.innerHTML=`${summary}<div class="pad"><table class="acctbl">
      <tr><th>日付</th><th>R数</th><th>3連単</th><th>TOP5</th><th>厳選</th><th>回収率</th></tr>${totalRow}${todayRow}${dayRows}
    </table></div>`;
}

function renderModel(rep){
  const m=$("#main");
  if(!rep){m.innerHTML='<div class="note">モデル情報がありません。<br>学習完了後に表示されます。</div>';return}
  const tm=rep.test_metrics||{}, bm=rep.baseline_metrics||{};
  const fi=Object.entries(rep.feature_importance||{}).slice(0,10)
    .map(([k,v])=>`<div class="kv"><span>${k}</span><span class="num">${Math.round(v)}</span></div>`).join("");
  m.innerHTML=`<div class="pad">
    <div class="kv"><span>学習日時</span><span class="num">${rep.trained_at||"-"}</span></div>
    <div class="kv"><span>学習期間</span><span class="num">${(rep.period||[]).join(" - ")}</span></div>
    <div class="kv"><span>学習行数</span><span class="num">${(rep.rows_train||0).toLocaleString()}</span></div>
    <div class="kv"><span>厳選条件</span><span class="num">通常 top5p≥${Math.round(SENGEN_TOP5P_MIN*100)}% / 超厳選 ≥${Math.round(SENGEN_SUPER_MIN*100)}%(検証約76%)・安定水面のみ</span></div>
    <div class="sec" style="margin-top:18px">テスト精度(直近期間・未学習データ)</div>
    <div class="kv"><span>1着的中率</span><span class="num">${pct(tm.win_hit_rate||0)} (基準 ${pct(bm.win_hit_rate||0)})</span></div>
    <div class="kv"><span>3連単 予測</span><span class="num">${pct(tm.top1_hit_rate||0)} (基準 ${pct(bm.top1_hit_rate||0)})</span></div>
    <div class="kv"><span>3連単 TOP5内</span><span class="num">${pct(tm.top5_hit_rate||0)} (基準 ${pct(bm.top5_hit_rate||0)})</span></div>
    <div class="kv"><span>3連単 TOP10内</span><span class="num">${pct(tm.top10_hit_rate||0)} (基準 ${pct(bm.top10_hit_rate||0)})</span></div>
    <div class="kv"><span>厳選 3連単的中率</span><span class="num">${tm.sengen&&tm.sengen.top5_hit_rate!=null?pct(tm.sengen.top5_hit_rate)+" ("+tm.sengen.races_per_day+"R/日)":"-"}</span></div>
    <div class="kv"><span>回収率(TOP5均等買い)</span><span class="num">${pct(tm.top5_roi||0)}</span></div>
    <div class="sec" style="margin-top:18px">特徴量重要度 TOP10</div>${fi}
  </div>`;
}

async function show(tab){
  const token=++showGen;
  cur=tab;
  {const hc=document.getElementById("hdrChips");if(hc)hc.innerHTML="";const sc=document.getElementById("senCount");if(sc)sc.textContent="";const dn=document.getElementById("dateNav");if(dn)dn.innerHTML="";const _tm=document.getElementById("todayMeta");if(_tm)_tm.innerHTML="";}
  const map={sen:"Sen",today:"Today",acc:"Acc",model:"Model"};
  ["Sen","Today","Acc","Model"].forEach(t=>$("#tab"+t).classList.toggle("on",map[tab]===t));
  const m=$("#main");m.innerHTML='<div class="spin"></div>';
  try{
    if(tab==="sen"){
      if(!pred) pred=await fetchJSON("predictions/latest.json");sortVenues(pred);
      if(token!==showGen) return;
      renderSengen();
    }else if(tab==="today"){
      viewPred=null;
      if(!pred) pred=await fetchJSON("predictions/latest.json");sortVenues(pred);
      if(token!==showGen) return;
      if(pred){latestDate=pred.date;if(!PREDS[pred.date])PREDS[pred.date]=pred;}
      renderToday();
      ensureDateList().then(()=>{if(token===showGen&&cur==="today"){renderDateNav(viewPred||pred);}});
    }else if(tab==="acc"){
      if(!VIEW.acc) VIEW.acc=await fetchJSON("accuracy.json").catch(()=>null);
      if(token!==showGen) return;
      renderAcc(VIEW.acc);window.scrollTo(0,0);
    }else{
      if(!VIEW.model) VIEW.model=await fetchJSON("model_report.json").catch(()=>null);
      if(token!==showGen) return;
      renderModel(VIEW.model);
    }
  }catch(e){
    if(token!==showGen) return;
    m.innerHTML=`<div class="note">データの取得に失敗しました。<br>${e.message}</div>`;
  }
}
$("#tabSen").onclick=()=>show("sen");
$("#tabToday").onclick=()=>show("today");
$("#tabAcc").onclick=()=>show("acc");
$("#tabModel").onclick=()=>show("model");
show("sen");
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");

let refreshBusy=false;
async function refreshLatest(){
  if(refreshBusy) return;
  refreshBusy=true;
  try{
    const fresh=await fetchJSON("predictions/latest.json");
    sortVenues(fresh);
    const changed=!pred||pred.generated_at!==fresh.generated_at||pred.results_updated_at!==fresh.results_updated_at;
    if(!changed) return;
    const wasCurrentDate=!pred||!viewPred||viewPred.date===pred.date;
    pred=fresh;
    latestDate=pred.date;
    PREDS[pred.date]=pred;
    if(wasCurrentDate) viewPred=null;
    if(cur==="sen"){
      renderSengen();
    }else if(cur==="today"&&wasCurrentDate){
      renderToday();
    }else if(cur==="acc"){
      renderAcc(VIEW.acc);
    }
  }catch(_){
    /* オフライン等は無視し、次回タイミングで再試行 */
  }finally{
    refreshBusy=false;
  }
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")refreshLatest();});
setInterval(()=>{if(document.visibilityState==="visible")refreshLatest();},75000);
</script>
