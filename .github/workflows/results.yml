name: results-update
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYYMMDD to backfill (blank=today)'
        required: false
        default: ''
concurrency:
  group: results
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests lhafile pandas numpy lightgbm
      - name: results update
        run: python scripts/fetch_results_only.py ${{ inputs.date }}
      - name: live re-predict (tenji)
        continue-on-error: true
        run: python scripts/predict_today.py --live
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add docs/predictions
          git diff --cached --quiet || git commit -m "results update"
          git pull --rebase --autostash
          git push
