name: backfill
on:
  workflow_dispatch:
    inputs:
      start:
        description: "start YYYYMMDD"
        required: true
      end:
        description: "end YYYYMMDD"
        required: true
concurrency:
  group: backfill-check
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  chunk:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        year: [2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lhafile pandas requests
      - name: build year
        env:
          IN_START: ${{ github.event.inputs.start }}
          IN_END: ${{ github.event.inputs.end }}
        run: |
          python - << 'PY'
          import os, subprocess
          y = int("${{ matrix.year }}")
          s = os.environ["IN_START"]
          e = os.environ["IN_END"]
          cs = max(int(s), int(f"{y}0101"))
          ce = min(int(e), int(f"{y}1231"))
          if cs > ce:
              print(f"{y}: out of range, skip")
              raise SystemExit(0)
          subprocess.run(["python", "scripts/build_dataset.py", "--start", str(cs),
                          "--end", str(ce), "--sleep", "0.25"], check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: entries-${{ matrix.year }}
          path: data/races/entries_${{ matrix.year }}.csv.gz
          if-no-files-found: ignore
