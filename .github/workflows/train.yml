name: train
on:
  workflow_dispatch:
concurrency:
  group: data
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy lightgbm
      - name: train model
        run: python scripts/train.py
      # 学習の出力は data/model_build(gitignore)。Release へ配布して参照先
      # (data/model/live_pointer.json)を書き、git の予備(data/model)も更新する。
      # どちらかが失敗したらジョブを失敗させる(何もコミットしない)。
      - name: モデルを配布 (Release資産) と予備の更新
        timeout-minutes: 10
        run: |
          python scripts/model_store.py publish
          python scripts/model_store.py freeze --force
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/model docs/model_report.json
          git diff --cached --quiet || git commit -m "train model"
          # 開催中ループがほぼ毎分 push するので、pull と push の間に割り込まれたらやり直す
          # (ここで落ちると、資産だけ上がって参照先と予備が届かず、学習からやり直しになる)。
          for i in 1 2 3; do
            if git pull --rebase --autostash && git push; then break; fi
            git rebase --abort 2>/dev/null || true
            if [ "$i" = 3 ]; then echo "3回試しても push できなかった"; exit 1; fi
            echo "pull/push に失敗した(try $i)。やり直す"
            sleep 3
          done
