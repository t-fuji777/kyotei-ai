name: auto-update
on:
  workflow_dispatch:
  schedule:
    # 毎時0分・30分はGitHub Actionsの混雑ピークでschedule欠落が起きやすい
    # (公式ドキュメントも正時を避けるよう推奨)。7分・37分へずらして欠落確率を下げる。
    # 2026-10-02: schedule配信が約110〜250分遅れるため、名目7:07開始では実際の初回起動が
    # 9:30〜10:50になり、朝一番のレース(締切8:30〜)が締切15分前に確定できず結果確定後の
    # 事後打刻になっていた(1日4〜11レース)。名目3:07〜6:37を追加し、7:00より前に着弾した
    # 回はループ内で7:00まで待機させる(5:00より前の着弾は従来通り即終了)。
    # 同日追記: scheduleは起動の保険に格下げした。主経路は workflow_dispatch で、
    # daily の末尾・watchdog・ループ自身の5時間引き継ぎが scripts/ensure_loop.sh で起動する
    # (30分おきの予約に対し実着は1日4回前後しかなく、遅延も数時間あるため)。
    - cron: "7,37 18-21 * * *"
    - cron: "7,37 22-23 * * *"
    - cron: "7,37 0-13 * * *"
concurrency:
  group: auto-update
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # lightgbm は4系に固定する(世代2のモデルは4系で学習・保存する。daily.yml・train.yml と同じ指定)。
      - run: pip install pandas numpy "lightgbm>=4.6,<5" lhafile requests
      # プッシュ通知(Web Push)だけが使うライブラリ。上の必須の依存とは分ける: これを入れられなくても
      # ループは始める(打刻・結果・オッズの更新を、通知の都合で止めない)。入らなかった回は
      # scripts/notify.py が自分で通知を飛ばす。版は固定する(送信側のテストはこの版で確かめている)。
      - name: 通知用のライブラリ(入らなくても続行)
        run: pip install "pywebpush==2.5.0" || echo "::warning::pywebpush を入れられなかった。この回はプッシュ通知を送らない(打刻・結果の更新は通常どおり行う)"
      - name: loop results + live re-predict
        env:
          GH_TOKEN: ${{ github.token }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
          NOTIFY_CHAT_ID: ${{ secrets.NOTIFY_CHAT_ID }}
          PUSH_SUBS_URL: ${{ vars.PUSH_SUBS_URL }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          commit_push() {
            git add docs/predictions
            if git diff --cached --quiet; then
              # update_all.py が取得の合間に行う公開(scripts/publish_stamps.sh)は push を1回しか
              # 試さず、断られたらコミットをローカルに残す。差分が無くても、未送信のコミットが
              # あれば下の手順(rebase して push)で送る。無ければ従来どおり何もしない。
              if [ -z "$(git rev-list -n 1 origin/main..HEAD 2>/dev/null)" ]; then echo "nothing to commit"; return; fi
              echo "no new changes, but local commits are not pushed yet"
            else
              git commit -m "$1"
            fi
            for attempt in 1 2 3 4 5; do
              git fetch origin main || true
              git rebase -X theirs origin/main || { echo "rebase failed, syncing to remote"; git rebase --abort || true; git reset --hard origin/main || true; return; }
              if git push origin HEAD:main; then echo "pushed (try $attempt)"; return; fi
              echo "push rejected (try $attempt), retrying"
              sleep 3
            done
            echo "push not completed this iteration (will retry next loop)"
          }
          # 各周回の先頭でリモートへ追随する。commit_push は「差分なし」で早期
          # return して fetch しないため、書くものが無い間は古い作業ツリーのまま
          # 走り続け、後から差分が出た瞬間に rebase -X theirs で他runnerの新しい
          # データを巻き戻す事故が起きていた(2026-08-05: 70レース巻き戻し・
          # 打刻36件を改竄)。未pushのローカルコミットがある時だけ reset を見送る。
          # fetch に失敗した時は 0 で戻る(非0で戻ると bash -e によりループ全体が終了する)。
          sync_remote() {
            git fetch origin main || return 0
            if git merge-base --is-ancestor HEAD FETCH_HEAD 2>/dev/null; then
              git reset --hard FETCH_HEAD
            else
              echo "local commits not yet pushed; keeping tree"
            fi
          }
          # dailyが全滅または大幅遅延した日でも当日を自己復旧させる。当日の予測ファイルが
          # 7:20を過ぎても無ければ朝次処理を代行する(再学習は省略。前日モデルで予測可能)。
          # ジョブ先頭の1回きりだと、7:00前に着弾して待機していた回では働かないため
          # ループ内で判定する。番組表が未公開なら predict_today は何も書かずに終わるので、
          # 10分おきに再試行する。
          self_heal() {
            echo "self-heal: 当日の予測ファイルが無い。朝次処理を代行する"
            python scripts/fetch_fan.py --latest || true
            python scripts/update_results.py || true
            python scripts/build_calib.py || true
            python scripts/predict_today.py || true
            git add data/races data/fan docs
            git diff --cached --quiet || git commit -m "self-heal morning $(TZ=Asia/Tokyo date +%Y%m%d)"
            git pull --rebase --autostash -X theirs || true
            git push || true
          }
          START=$(date +%s)
          HEAVY_AT=0
          HEAL_AT=0
          while true; do
            sync_remote
            # 参照先(data/model/live_pointer.json)が指すモデルを取得する。取得済みなら通信しない。
            # 失敗しても前回の取得分か git の予備(data/model)で動き続ける。
            python scripts/model_store.py fetch || true
            H=$(TZ=Asia/Tokyo date +%H)
            M=$(TZ=Asia/Tokyo date +%M)
            HM=$((10#$H*60 + 10#$M))
            if [ "$HM" -ge 1410 ] || [ "$HM" -lt 300 ]; then echo "outside active hours, exit"; exit 0; fi
            # 5:00〜7:00に着弾した回は終了せず7:00まで待つ(schedule遅延対策で早い時刻にも
            # 予約を置いているため)。待機中も5時間キャップは進むので、引き継ぎは従来通り。
            if [ "$HM" -lt 420 ]; then echo "before 7:00 JST, waiting"; sleep 60; continue; fi
            YMD=$(TZ=Asia/Tokyo date +%Y%m%d)
            if [ ! -f "docs/predictions/$YMD.json" ] && [ "$HM" -ge 440 ] && [ $(( $(date +%s) - HEAL_AT )) -ge 600 ]; then
              self_heal
              HEAL_AT=$(date +%s)
            fi
            # 打刻(T-15)前の窓で展示を反映してから確定させる。展示は締切約20分前に
            # 公開されるため、10分間隔の重い周回だけでは打刻の約8割が展示なしで
            # 確定していた。対象が無い分には数十msで抜ける軽量モード。
            python scripts/predict_today.py --live-window || true
            python scripts/update_all.py --results-only || true
            commit_push "auto results"
            NOW=$(date +%s)
            if [ $(( NOW - HEAVY_AT )) -ge 600 ]; then
              # 重い周回のupdate_all(full)は内部で打刻も行うため、その直前にも展示反映の
              # 先回りを入れる。これが無いと、fullのタイミングでT-15を跨いだレースが
              # 展示なしで確定し、打刻後差し替え禁止ガードにより以後修正不能になる
              # (2026-09-03実測: この経路の欠落で展示反映済み打刻が38%止まりだった)。
              python scripts/predict_today.py --live-window || true
              python scripts/update_all.py || true
              python scripts/update_all.py --results-only || true
              commit_push "auto results"
              python scripts/predict_today.py --live || true
              python scripts/update_all.py --results-only || true
              commit_push "auto update"
              HEAVY_AT=$(date +%s)
            fi
            E=$(( $(date +%s) - START ))
            # 5時間で後継へ引き継ぐ。以前は次のschedule着弾を待つだけで、着弾が遅い日は
            # 20〜45分の無人時間ができ、その間のレースが締切15分前に確定できなかった
            # (2026-09-21〜10-01で5日、19〜20時台に1〜9件)。後継は自分で起動する。
            # 起動した回は concurrency によりこの回の終了を待ってから走り出す。
            if [ "$E" -ge 17400 ]; then
              echo "5h cap, exit for handoff"
              bash scripts/ensure_loop.sh --handoff || true
              exit 0
            fi
            sleep 60
          done
